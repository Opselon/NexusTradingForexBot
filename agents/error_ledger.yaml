errors:
  - id: RTF-001
    first_seen: "2026-09-24T05:45:47+03:30"
    last_seen: "2026-09-24T05:50:09+03:30"
    severity: CRITICAL
    subsystem: database/migration + adapters/audit_db
    exact_message: >-
      column "signal_dedup_key" of relation "audit_signals" does not exist /
      column "account_source" of relation "audit_account_snapshots" does not
      exist
    root_cause: >-
      The PostgreSQL schema is Python-generated. migrate_domain applied only
      the scanned baseline CREATEs (35 tables, 439 of 463 required columns);
      the other 24 columns were healed at runtime by SQLite-only
      _add_column_if_missing calls invisible to the migration scan, so the
      migration legitimately reported applied=37 errors=0 while runtime DDL
      differed. Proven on the real database: live nexusdb has all 35 tables
      but lacks exactly those 24 columns.
    reproduction: >-
      Boot the engine with audit provider=postgresql against a nexusdb
      provisioned by the baseline-only migration; every audit_signals INSERT
      fails with the missing-column error.
    user_impact: >-
      Every signal, account snapshot and guard telemetry row is rejected;
      audit evidence for the whole session is lost.
    financial_impact: >-
      HIGH — no durable record of proposed/executed decisions, no dedup key,
      no post-hoc reconciliation basis.
    recovery: >-
      Provider-agnostic additive heal: additive_columns_statements() diffs
      APP_REQUIRED_COLUMNS against the scanned baseline and emits exactly the
      24 absent columns (SQLite dialect, translated by translate_ddl to
      ADD COLUMN IF NOT EXISTS). Idempotent.
    owner: agent/nse-always-on-runtime-fix
    related_pr: null
    status: VERIFIED_LOCAL
    regression_test: >-
      tests/unit/test_rtf001_provider_agnostic_schema_contract.py (12) plus
      tests/unit/test_rtf001_real_postgresql_schema.py (2, real PostgreSQL)
    runtime_verified: false
    main_verified: false
    notes: >-
      Dry-run against live nexusdb: emitted set == live-missing set
      (24 == 24, identical). Real-DB test builds the schema on a scratch
      database and lands all 463 required columns. Not yet healed ON nexusdb
      itself (that happens on the next boot of the merged fix) and not yet
      verified in a real runtime session.

  - id: RTF-002
    first_seen: "2026-09-24T05:46:50+03:30"
    last_seen: "2026-09-24T05:50:09+03:30"
    severity: CRITICAL
    subsystem: adapters/audit_db (dead-letter store)
    exact_message: >-
      DEAD-LETTER WRITE IMPOSSIBLE — no write sink on a non-SQLite dead-letter
      store; financial record unrecoverable
    root_cause: >-
      Construction-order race. _dead_letter_write_sink() captured
      get_domain_backend("audit") at __init__ time, BEFORE _build_write_plane()
      provisioned the audit domain. On a fresh PostgreSQL process the backend
      registry is still empty, so the sink was permanently None and every
      failed row became unrecoverable.
    reproduction: >-
      Construct AuditRepository with a PostgreSQL provider while the audit
      domain is not yet provisioned on the fabric; the DeadLetterStore is
      handed write_sink=None for the lifetime of the process.
    user_impact: >-
      The last-resort persistence path for failed audit writes is silently
      disabled for the entire process; failed financial records are discarded.
    financial_impact: HIGH — unrecoverable loss of audit evidence.
    recovery: >-
      Resolve the backend lazily at call time inside the returned closure
      instead of caching it at construction. Reads the registry only (never
      provisions); returns False rather than raising.
    owner: agent/nse-always-on-runtime-fix
    related_pr: null
    status: VERIFIED_LOCAL
    regression_test: tests/unit/test_rtf002_deadletter_sink_lazy_resolution.py (5)
    runtime_verified: false
    main_verified: false


name: Docs

# Documentation CI + GitHub Pages deployment (Nexus-Docs owned).
# Validates the documentation surface on every docs-affecting change and
# deploys the built multilingual site to GitHub Pages on main.
# This workflow does NOT duplicate project CI responsibilities (ci.yml):
# it only validates docs/ + site/ + README and publishes the static site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
    tags:
      - "v*"
  release:
    types: [published, edited]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent docs validation; deploys are serialized per ref.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Refresh release metadata (What's New / releases page)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/docs/fetch_releases.py

      - name: Lint docs tooling (ruff)
        run: |
          ruff check scripts/docs/
          ruff format --check scripts/docs/

      - name: Type-check docs tooling (mypy)
        run: mypy scripts/docs/

      - name: Secret scan (docs surface)
        run: python scripts/ci/scan_secrets.py

      - name: Build site
        run: python scripts/docs/build_site.py

      - name: Docs doctor (links, anchors, translations, RTL, drift)
        run: python scripts/docs/check_docs.py

      - name: Translation audit
        run: python scripts/docs/check_translations.py

      - name: Live smoke (deployed site) — deploy job only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "smoke runs in deploy job after Pages propagation"

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/_site
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Refresh release metadata (What's New / releases page)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/docs/fetch_releases.py

      - name: Build site
        run: python scripts/docs/build_site.py

      - name: Site self-check (built artifacts + base-path discipline)
        run: python scripts/docs/check_docs.py --built-only || python scripts/docs/check_docs.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Live smoke test (deployed site)
        env:
          SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 45   # Pages propagation window
          python scripts/docs/live_smoke.py --url "${SMOKE_URL}"

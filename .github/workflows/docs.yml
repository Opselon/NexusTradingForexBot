name: Docs

# Documentation CI + GitHub Pages deployment (Nexus-Docs owned).
# Validates the documentation surface on every docs-affecting change and
# deploys the built multilingual site to GitHub Pages on main.
# This workflow does NOT duplicate project CI responsibilities (ci.yml):
# it only validates docs/ + site/ + README and publishes the static site.
#
# TRIGGER CONTRACT (DEC-0008): this workflow is the source of the REQUIRED
# context "Validate documentation" on branch protection, so it MUST run on
# EVERY push to main — a docs-silent commit still needs the context to report
# success or main sits pending forever. The old top-level on.push.paths filter
# starved main of the context whenever a push touched no docs paths.
# Path scoping therefore moved INSIDE the job: docs-affecting pushes run the
# full validator chain, all other pushes take the fast always-report no-op.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published, edited]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent docs validation; deploys are serialized per ref.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-affecting changes (DEC-0008 always-report)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On PRs: diff against the PR base. On pushes: diff against the
          # previous main tip (before=<base sha> after=<pushed sha>).
          token: ${{ github.token }}
          filters: |
            docs_changed:
              - "docs/**"
              - "site/**"
              - "agents/**"
              - "*.md"
              - "scripts/docs/**"
              - "pyproject.toml"
              - ".github/workflows/docs.yml"

      - name: Fast no-op report (no docs changes)
        if: steps.filter.outputs.docs_changed != 'true'
        run: |
          echo "No documentation changes detected — skipping validation and reporting success."
          echo "context 'Validate documentation' still reports success on this push (DEC-0008)."

      - name: Setup Python
        if: steps.filter.outputs.docs_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs tooling
        if: steps.filter.outputs.docs_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Refresh release metadata (What's New / releases page)
        if: steps.filter.outputs.docs_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/docs/fetch_releases.py

      - name: Lint docs tooling (ruff)
        if: steps.filter.outputs.docs_changed == 'true'
        run: |
          ruff check scripts/docs/
          ruff format --check scripts/docs/

      - name: Type-check docs tooling (mypy)
        if: steps.filter.outputs.docs_changed == 'true'
        run: mypy scripts/docs/

      - name: Secret scan (docs surface)
        if: steps.filter.outputs.docs_changed == 'true'
        run: python scripts/ci/scan_secrets.py

      - name: Build site
        if: steps.filter.outputs.docs_changed == 'true'
        run: python scripts/docs/build_site.py

      - name: Docs doctor (links, anchors, translations, RTL, drift)
        if: steps.filter.outputs.docs_changed == 'true'
        run: python scripts/docs/check_docs.py

      - name: Translation audit
        if: steps.filter.outputs.docs_changed == 'true'
        run: python scripts/docs/check_translations.py

      - name: Live smoke (deployed site) — deploy job only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "smoke runs in deploy job after Pages propagation"

      - name: Upload site artifact
        if: steps.filter.outputs.docs_changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/_site
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.docs_changed == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Refresh release metadata (What's New / releases page)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/docs/fetch_releases.py

      - name: Build site
        run: python scripts/docs/build_site.py

      - name: Site self-check (built artifacts + base-path discipline)
        run: python scripts/docs/check_docs.py --built-only || python scripts/docs/check_docs.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live smoke test (deployed site)
        env:
          SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 45   # Pages propagation window
          python scripts/docs/live_smoke.py --url "${SMOKE_URL}"

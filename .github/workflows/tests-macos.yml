          # github.sha is the ephemeral merge commit, which the depth-1
          # checkout leaves shallow-grafted, so the diff finds no merge
          # base and the planner fails rc=3 (2026-11-09).
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")";; esac

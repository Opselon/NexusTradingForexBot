name: CI

on:
  push:
    branches: [main, develop, ci-tests]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # CI quota diet (2026-11): the weekly meta-scan became SEMI-MONTHLY.
    # Hosted minutes are the scarce resource; everything routine moved to the
    # tiered self-hosted pool, so the schedule only keeps its drift-catching
    # duty (wiring drift / dependency-world changes) twice a month, and the
    # expensive runtime legs below run on this event too.
    - cron: "13 5 1,15 * *"   # 1st & 15th, 05:13 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite incl. integration tests (use on ci-tests or manually)"
        type: boolean
        default: false
      base_sha:
        description: "Planner base SHA for a targeted dispatch run (default: auto from the event). Set it to run the planner against an explicit base — e.g. a leaf-change timing proof on a scratch branch, where the event carries no base."
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

  # PostgreSQL test arms: NOT run on GitHub CI. They require a MIGRATED
  # server (scratch databases, a provisioned nexusdb, credentials in the
  # OS secret store); a throwaway container cannot supply one, and standing
  # it up made the quality job 45 minutes long while STILL not producing a
  # verdict. They run in the LOCAL gate against a real server:
  #     python scripts/ci/check_local.py --pg
  # On CI those tests skip, and the quality job REPORTS the skip as a
  # status line rather than counting it as a pass - a skip is not a pass.
  #
  # NOTE: PG_TEST_URL / PG_TEST_DSN used to sit here and were read by
  # nothing (the suite keys off NSE_PG_TEST_URL / NSE_TEST_PG_DSN), so
  # their presence proved only that someone had written a variable down.

  # Canonical per-run results directory. Every check writes ONLY into its own
  # subdirectory; the tree is wiped and recreated at the start of every run so
  # no result from a previous run can leak into this one.
  CI_RESULTS_DIR: ci-results
  # Retention for the single canonical CI results artifact (days).
  CI_ARTIFACT_RETENTION_DAYS: "30"
  # Telegram CI/CD observability — presence-only wiring; values come from
  # repo secrets and are NEVER printed or written into reports.
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: ${{ secrets.USER_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # CI self-integrity — runs BEFORE every other job. This is the meta-test of
  # CI itself (task - 2/3/32/33): it statically analyzes every workflow in
  # .github/workflows and fails the run if any of these invariants break:
  #   * a step references needs.<job>.outputs.<name> that is never declared
  #   * a job uses a local composite action without a prior actions/checkout
  #   * a matrix leg would upload a colliding artifact name
  #   * a required gate has an empty / always-false if (silent skip)
  #   * a missing YAML parse / undefined job reference
  # It also runs the canonical change classifier (classify_changes.py) so the
  # SAME lane formula every job later branches on is exercised here.
  # ---------------------------------------------------------------------------
  ci-integrity:
    name: CI Integrity and Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install workflow analyzer deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Workflow static integrity scan
        run: |
          python scripts/ci/check_workflows.py --format text --strict

      - name: Runner routing consistency (canonical tier order)
        run: python scripts/ci/check_runner_routing.py

      - name: Decision-ID uniqueness (P3 — one DEC id, one canonical record)
        run: |
          python scripts/ci/check_decision_ids.py

      - name: ML contract drift guard (docs/ml-system vs source)
        run: |
          # ML-CI-002: canonical ML constants are parsed from source and must
          # match the docs/ml-system contract suite. Direction of truth is
          # source; a doc quoting a superseded value (or a constant changed
          # without a docs update) fails CI.
          python scripts/ci/check_ml_contract_drift.py

      - name: Local-gate parity (same contracts as check_local.py)
        run: |
          # GATE PARITY CONTRACT (CHG-0049): CI must FAIL when the local
          # pre-push gate and CI drift apart — different config source,
          # different manifest, divergent status taxonomy, or a CI-only lint
          # class the local gate silently omits. Emitted as JSON evidence.
          python scripts/ci/gate_parity.py --json > gate-parity.json
          cat gate-parity.json

      - name: Classify changes (sanity check of the canonical classifier)
        run: |
          python scripts/ci/classify_changes.py --files "src/nexus_scalp/risk/risk_engine.py Web/app.js Dockerfile .github/workflows/ci.yml"

      - name: Git governance scan (agents/git_governance.md)
        run: |
          # GIT GOVERNANCE CONTRACT (agents/git_governance.md): automation and
          # workflow files must not instruct destructive git, and the
          # governance preflight must import + self-check cleanly. Read-only.
          python scripts/ci/check_git_governance.py

      - name: Secret scan (canonical — one run per CI run)
        run: |
          # The ONLY secret scan on the PR path. docs.yml and release.yml
          # used to run scan_secrets.py under their own gates, so a normal
          # PR ran it 0 times while the external GitGuardian check still
          # flagged the diff. stdlib-only, no venv needed.
          python scripts/ci/scan_secrets.py

      # NOTE (2026-09-14 reconstruction): lane gating is applied in
      # tests-os.yml (OS matrix) — where a skip is an explicit, auditable
      # SKIP-REPORT. It is deliberately NOT applied to the quality job's
      # pytest step: scripts/ci/ci_final_gate.py is FAIL-CLOSED on a MISSING
      # pytest record, and no docs-only PR is worth trading that contract
      # against a ~6-minute ubuntu lane (false negatives are worse than
      # wasted CI — brief 21).

  # ---------------------------------------------------------------------------
  # Fast, essential checks — run on every push/PR to main|develop.
  # Every validation step follows the same pattern:
  #   1. run the tool, capturing stdout+stderr into ITS OWN result file
  #   2. record the real exit code in run-info/<check>.json
  #   3. after ALL checks, report + package + upload artifacts
  #   4. fail the job at the very end if any check failed
  # This guarantees the full artifact (including failure evidence) is produced
  # even when checks fail — failures are never hidden by continue-on-error.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # QUALITY — split execution under ONE required verdict (DevOps audit 2026-11).
  # The old serial quality job ran install, ruff, format check, type check,
  # pytest, smoke and the runtime gates on ONE clock (550s median - THE PR
  # critical path). They are independent work: quality-lint and
  # quality-tests now run in PARALLEL and the required "Code Quality & Tests"
  # context stays a single fail-closed verdict job (branch protection and
  # release_auth_gate.REQUIRED_MAIN_CI_CHECKS untouched). A skipped child
  # (cancelled/missing) fails the verdict - never a silent pass.
  #
  # Dependencies install through the DOCUMENTED lock flow (uv pip install
  # --system -r requirements.lock, hash-verified) restoring the design note in
  # dependency-lock.yml; a plain resolver pass over -e ".[dev,web,postgres]"
  # re-resolved ~90 packages on every job.
  # ---------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Runner availability preflight — CI quota diet (2026-11). Picks the
  # fastest online+idle lane: tier-1 opselon-vm (8-thread Docker runner) ->
  # tier-2 nexus-2core -> GitHub-hosted. `runs_on` is ALWAYS a valid
  # runs-on target (hosted image when no tier matches), so a single lane
  # serves every class without duplication. Same routing contract as
  # Tests (OS Matrix) — see scripts/ci/runner_select.py.
  # -------------------------------------------------------------------------
  runner-select:
    name: Runner Selector (ci)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runner_class: ${{ steps.select.outputs.runner_class }}
      runs_on: ${{ steps.select.outputs.runs_on }}
      selection_reason: ${{ steps.select.outputs.selection_reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select runner (availability preflight)
        id: select
        uses: ./.github/actions/runner-select
        env:
          NSE_RUNNER_STATUS_TOKEN: ${{ secrets.NSE_RUNNER_STATUS_TOKEN }}
        with:
          platform: linux
          labels: "self-hosted,Linux,X64,opselon-vm"
          fallback_labels: "self-hosted,Linux,X64,nexus-2core"

          # A fork PR (head repo != this repo) is untrusted: never
          # self-hosted, never exposed to runner credentials.
          untrusted: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  quality-lint:
    name: Quality — Lint, Types & Static Gates
    needs: runner-select
    runs-on: ${{ fromJSON(needs.runner-select.outputs.runs_on) }}
    # Speed cap (2026-11-09, hard user requirement): no PR-feedback job
    # runs longer than 10 minutes; target 3-5 min. Lint measured 115s.
    # TEMPORARY (2026-11-10, user directive): raised to 20 — tier-1 is
    # OFF, so the job falls back to Dubai (tier-2) and needs install time
    # (cold venv + torch reinstall on the first run). Back to 10 when
    # tier-1 returns / the venv is warm.
    timeout-minutes: 20

    env:
      CI_RESULTS_DIR: ci-results-lint
      NSE_RUNNER_CLASS: ${{ needs.runner-select.outputs.runner_class }}
      # Primary index is the TUNA mirror (2026-11-09): files.pythonhosted.org
      # is UNREACHABLE from tier-1 (uv connect timeout after 3 retries), so
      # PyPI can resolve a version but can never deliver its wheel — and the
      # Aliyun node serving tier-1 still lacks filelock 4.2.10 (while the
      # node this VM hits has it). TUNA's node serving tier-1 IS synced
      # (proven by the proof/leaf-timing diagnostic: TUNA lists 4.2.10 and
      # uv resolves it in 4.36s; USTC/BFSU/Aliyun all lack it). The Aliyun
      # mirror stays as the extra index (it CAN serve wheels, unlike PyPI).
      # uv resolves UV_INDEX_URL / UV_DEFAULT_INDEX BEFORE PIP_INDEX_URL, so
      # both are pinned here: the tier-1 image exports them (Aliyun) and
      # would otherwise override this primary (5e50710d: "no version of
      # typer==0.29.0" while TUNA listed it).
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple/
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      PIP_DEFAULT_TIMEOUT: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One canonical environment (setup-python + pinned uv + lock venv):
      # ./.github/actions/setup-python-env. The dependency-intelligence
      # cache restore below is venv-independent, so it runs after setup.
      - name: Set up Python environment (canonical)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"
          runner-class: ${{ env.NSE_RUNNER_CLASS }}

      # mypy/ruff keep their caches in the workspace by default, and
      # actions/checkout wipes the workspace on every job — so both tools
      # ran COLD on every run (a full-repo type-check pass on 2 cores is
      # minutes, every time).
      # On self-hosted tiers, point them at a runner-persistent cache dir
      # (content-keyed, so a stale entry cannot survive a source change);
      # hosted lanes keep the workspace default (ephemeral runners).
      - name: Point type/lint caches at persistent storage (self-hosted)
        run: |
          if [ "${{ env.NSE_RUNNER_CLASS }}" = "self-hosted" ]; then
            mkdir -p "$HOME/.cache/nse-ci/mypy" "$HOME/.cache/nse-ci/ruff"
            echo "MYPY_CACHE_DIR=$HOME/.cache/nse-ci/mypy" >> "$GITHUB_ENV"
            echo "RUFF_CACHE_DIR=$HOME/.cache/nse-ci/ruff" >> "$GITHUB_ENV"
          fi

      - name: Cache dependency intelligence graph
        if: env.NSE_RUNNER_CLASS != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/dependency_intelligence/cache.json
          key: dep-graph-v1-${{ hashFiles('src/nexus_scalp/**/*.py') }}
          restore-keys: |
            dep-graph-v1-

      # -------- Results tree + run metadata (fresh on every run) --------
      - name: Initialize results tree
        run: |
          python scripts/ci/make_ci_results.py init "$CI_RESULTS_DIR" \
            --json "$CI_RESULTS_DIR/run-info/env-digest.json"

      # -------- Telegram: workflow started (advisory; never fails CI) --------
      - name: Telegram - CI started
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" run-started || true

      # -------- Ruff lint (own directory; JSON machine output + text log) --------
      - name: Ruff - Lint
        id: ruff-lint
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format json > "$CI_RESULTS_DIR/ruff/lint.json" 2> "$CI_RESULTS_DIR/ruff/lint.stderr.txt"
          rc=$?
          ruff check . > "$CI_RESULTS_DIR/ruff/lint.txt" 2>&1 || true
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" ruff_lint "$rc" "violations found (see ruff/)" || true
          exit 0

      # -------- Ruff format check (validates, never rewrites) --------
      - name: Ruff - Format check
        id: ruff-format
        continue-on-error: true
        run: |
          set +e
          ruff format --check . > "$CI_RESULTS_DIR/format/format.txt" 2>&1
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" ruff_format "$rc" "files would be reformatted (see format/)" || true
          exit 0

      # -------- CI auto-repair (CHG-0052): repair the CHECKOUT, never the commit.
      # Runs ONLY when the format check failed. The committed tree stays red -
      # ruff_format remains failed in run-info by design.
      - name: Ruff - Auto-repair checkout (safe, artifacted)
        if: steps.ruff-format.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          python scripts/ci/ci_ruff_repair.py --results "$CI_RESULTS_DIR"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "RUFF_REPAIR_STATUS=repaired" >> "$GITHUB_ENV"
          else
            echo "RUFF_REPAIR_STATUS=failed" >> "$GITHUB_ENV"
          fi
          exit 0

      # -------- P2 torch.load security guard (AST-based, fail-loud) --------
      - name: torch.load safety guard (P2)
        run: python scripts/ci/check_torch_load_safety.py

      # -------- Critical-path manifest enforcement (QA hardening, P0) --------
      - name: Critical manifest enforcement (drift gate)
        run: python scripts/ci/critical_manifest.py

      # -------- Mutation runner smoke (QA hardening, P0) --------
      - name: Mutation runner smoke
        run: |
          python scripts/qa/run_mutations.py --list-targets > "$CI_RESULTS_DIR/mutation-smoke.json"
          python - <<'PY'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["CI_RESULTS_DIR"], "mutation-smoke.json")))
          ok = (
              d.get("repo_root_ok") is True
              and d.get("python_is_running_interpreter") is True
              and d.get("mutations_total", 0) >= 9
              and all(e.get("target_exists") and e.get("battery_exists") and e.get("anchor_unique")
                      for e in d.get("catalog", []))
          )
          print("mutation runner smoke:", "PASS" if ok else "FAIL")
          sys.exit(0 if ok else 1)
          PY

      # -------- Anti-crash static (silent-handler / lost-traceback policy) --------
      - name: Anti-crash static policy
        id: anti_crash
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR/anti_crash"
          python scripts/ci/anti_crash_static.py > "$CI_RESULTS_DIR/anti_crash/anti_crash.txt" 2>&1
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" anti_crash "$rc" \
            "silent exception handler(s) found (see anti_crash/)" || true
          if [ "$rc" -ne 0 ]; then
            grep -E '^  src/|^\[' "$CI_RESULTS_DIR/anti_crash/anti_crash.txt" | head -20 \
              | sed 's/^/::error::anti-crash: /' || true
            exit "$rc"
          fi

      # -------- Runtime dependency closure gate (NSE rt-deps lane) --------
      - name: Runtime dependency closure
        id: runtime_deps
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR"
          python -m nexus_scalp.release.runtime_deps --json > "$CI_RESULTS_DIR/runtime_deps.json" 2> "$CI_RESULTS_DIR/runtime_deps.log"
          rc=$?
          cat "$CI_RESULTS_DIR/runtime_deps.json"
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" runtime_deps "$rc" "dependency closure incomplete (see runtime_deps.json + runtime_deps.log)" || true
          exit 0

      - name: Mypy - Type checking
        id: mypy
        continue-on-error: true
        run: |
          set +e
          mypy src --junit-xml "$CI_RESULTS_DIR/mypy/mypy-junit.xml" > "$CI_RESULTS_DIR/mypy/mypy.txt" 2>&1
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" mypy "$rc" "type errors found (see mypy/)" || true
          if [ "$rc" -ne 0 ]; then
            grep -E 'error:' "$CI_RESULTS_DIR/mypy/mypy.txt" | head -10 | sed 's/^/::error::/' || true
          fi
          exit 0

      # -------- OR-verb portability gate --------
      - name: OR-verb portability gate
        run: |
          python scripts/ci/check_or_verb_portability.py

      # -------- Secret presence preflight (booleans ONLY — values never printed) --
      - name: Secret presence check
        continue-on-error: true
        run: |
          python scripts/ci/make_ci_results.py secret-check "$CI_RESULTS_DIR"
          exit 0

      # -------- Aggregate: step summary + manifest + checksums --------
      - name: Generate CI summary (step summary + summary.md)
        continue-on-error: true
        run: |
          set +e
          python scripts/ci/make_ci_results.py summary "$CI_RESULTS_DIR" || true
          python scripts/ci/make_ci_results.py manifest "$CI_RESULTS_DIR" || true
          python - <<'PY' || true
          import json, os
          root = os.environ["CI_RESULTS_DIR"]
          info_dir = os.path.join(root, "run-info")

          def load(name):
              try:
                  with open(os.path.join(info_dir, name), encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}

          checks = {
              "Ruff Lint": load("ruff_lint.json").get("status", "skipped"),
              "Ruff Format": load("ruff_format.json").get("status", "skipped"),
              "Anti-crash": load("anti_crash.json").get("status", "skipped"),
              "Mypy": load("mypy.json").get("status", "skipped"),
              "Runtime deps": load("runtime_deps.json").get("status", "skipped"),
          }
          lines = ["## Quality — Lint, Types & Static Gates", ""]
          for name, status in checks.items():
              lines.append(f"- {name}: **{status.upper()}**")
          lines.append("")
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          PY
          exit 0

      # -------- Failure summary IN THE JOB LOG (CI-FAILSUM-001) --------
      - name: Print failure summary to job log
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/ci_failure_summary.py --results "$CI_RESULTS_DIR"

      # -------- Telegram: run finished (advisory; never fails CI) --------
      - name: Telegram - CI finished
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" run-finished || true
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" artifacts || true

      # -------- One canonical artifact per run --------
      - name: Upload CI results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-quality-lint-${{ github.workflow }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-results-lint/
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

      # -------- Machine-readable review status (one predictable schema) -------
      - name: Emit review-status.json
        if: always()
        run: |
          python - <<'PY'
          import json, os, time
          root = os.environ["CI_RESULTS_DIR"]
          info_dir = os.path.join(root, "run-info")
          def load(name):
              try:
                  with open(os.path.join(info_dir, name), encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}
          checks = ["ruff_lint", "ruff_format", "anti_crash", "mypy", "runtime_deps"]
          details = []
          status = "passed"
          for c in checks:
              d = load(c + ".json")
              s = d.get("status", "skipped")
              if s in ("failed", "errored"):
                  status = "failed"
              details.append({"check": c, "status": s, "detail": d.get("detail", "")})
          payload = {
              "job": "quality-lint",
              "status": status,
              "workflow": os.environ.get("GITHUB_WORKFLOW", "CI"),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "details": details,
          }
          os.makedirs(info_dir, exist_ok=True)
          with open(os.path.join(info_dir, "review-status.json"), "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          print("review-status.json ->", status)
          PY

      # -------- Final gate: fail-closed over THIS lane's checks -------
      # Missing records FAIL (never a silent pass); only explicit blocked
      # records are legitimate non-runs. Subset selection via --checks keeps
      # the canonical CHECKS tuple and its regression net intact.
      - name: Fail job if any check failed (fail-closed)
        if: always()
        run: python scripts/ci/ci_final_gate.py --checks ruff_lint,ruff_format,anti_crash,mypy,runtime_deps

  quality-tests:
    name: Quality — Tests & Runtime Certification
    needs: runner-select
    runs-on: ${{ fromJSON(needs.runner-select.outputs.runs_on) }}
    # Speed cap (2026-11-09, hard user requirement): no PR-feedback job
    # runs longer than 10 minutes; target 3-5 min. This cap lands WITH the
    # tier-1 speedup, never alone: on the 2-core tier-2 box the expanded
    # pytest alone measured 1449.8s (run 42678149634), so tier-2 CANNOT fit
    # this job in 10 min — the routing must prefer tier-1 (8-thread,
    # pytest -n 8, same suite ~8 min on hosted). History: 25m killed PR
    # #731 at 25m36s mid-pytest, which is why this was 45m; the 45m is
    # gone because the user requires the cap AND the tier-1 speedup
    # together. If tier-1 is offline the job times out at 10m on the
    # fallback instead of running 27m — that is the fail-closed guard
    # doing its job, not a bug: bring tier-1 back, do not raise the cap.
    # TEMPORARY (2026-11-10, user directive): the user turned tier-1 OFF
    # and raised the cap to 20 — the job now falls back to Dubai (tier-2)
    # and needs install time (cold venv + torch reinstall on the first
    # run). Back to 10 when tier-1 returns / the venv is warm.
    # Leaf PRs (targeted selection, ~7 files) run in ~1-2 min; the
    # expanded suite is the remaining wall — see docs/CI_ARCHITECTURE.md.
    timeout-minutes: 20

    env:
      NSE_RUNNER_CLASS: ${{ needs.runner-select.outputs.runner_class }}
      # Primary index is the TUNA mirror (2026-11-09): files.pythonhosted.org
      # is UNREACHABLE from tier-1 (uv connect timeout after 3 retries), so
      # PyPI can resolve a version but can never deliver its wheel — and the
      # Aliyun node serving tier-1 still lacks filelock 4.2.10 (while the
      # node this VM hits has it). TUNA's node serving tier-1 IS synced
      # (proven by the proof/leaf-timing diagnostic: TUNA lists 4.2.10 and
      # uv resolves it in 4.36s; USTC/BFSU/Aliyun all lack it). The Aliyun
      # mirror stays as the extra index (it CAN serve wheels, unlike PyPI).
      # uv resolves UV_INDEX_URL / UV_DEFAULT_INDEX BEFORE PIP_INDEX_URL, so
      # both are pinned here: the tier-1 image exports them (Aliyun) and
      # would otherwise override this primary (5e50710d: "no version of
      # typer==0.29.0" while TUNA listed it).
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple/
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      PIP_DEFAULT_TIMEOUT: "30"
      # Test-database isolation (fail-closed): this lane NEVER talks to a
      # real/shared database. The self-hosted runners are persistent
      # machines, so a previous run may have left a persisted
      # app_settings.db pointing at PostgreSQL — and the audit
      # test-isolation seam plus the persisted provider would otherwise
      # resolve the test DB from that machine state. Pinning sqlite +
      # per-run temp paths covers every step, including the layered-smoke
      # CLI and runtime gate, which run outside pytest and never see
      # conftest's fixtures. Proven by the assert step below.
      #
      # The provider pin is a literal, so it CAN live at job level. The
      # four temp paths CANNOT: ${{ runner.temp }} is a step-only context
      # — GitHub rejects the WHOLE workflow at parse time if it appears
      # in job-level env (f488c48 broke ci.yml + tests-os.yml exactly this
      # way: zero jobs ran on three pushes). The "Pin test DB" step below
      # exports the same paths via $RUNNER_TEMP + $GITHUB_ENV instead.
      NSE_DATABASE__PROVIDER: sqlite

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The C planner resolves changed files with
          #   git diff --name-only base...head
          # which needs the merge base. The default depth-1 checkout has no
          # base commit, so the engine exited rc=3 ("git diff failed") and the
          # planner never produced a plan. 0 = full history for this job.
          #
          # NOTE: fetch-depth 0 ships 88.6 MiB of pack (every blob in the
          # repo) over the self-hosted runner's tethered uplink and measured
          # 2m37s of pure network on 2026-11-09. The step below instead
          # pulls full COMMIT+TREE history blobless (measured 4.9 MiB,
          # 18x smaller): `git diff --name-only` resolves paths from TREE
          # objects only, so the planner contract is preserved at a fraction
          # of the transfer; blobs for the working tree come with checkout.
          fetch-depth: 1

      - name: Fetch planner history (blobless = commit+tree only)
        # Gives the C planner the merge base without shipping 88 MiB of
        # file contents. The shared script (scripts/ci/fetch_planner_history.bash)
        # fetches base+head bloblessly, VERIFIES merge-base, and escalates
        # to unshallow if the fetch was a no-op on a virgin shallow clone
        # (tier-1, 2026-11-09: fetch rc=0, merge-base failed, job dead
        # in 31s) — so a fresh runner is merge-base-ready with zero manual
        # steps. On a pull_request event github.sha is the EPHEMERAL merge
        # commit GitHub builds in-memory, not the branch head - fetching it
        # would resolve nothing. Use the real head SHA; the push fallback
        # keeps before.. (the prior head); inputs.base_sha (dispatch) wins.
        shell: bash
        run: |
          set -euo pipefail
          base="${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          bash scripts/ci/fetch_planner_history.bash "$base" "$head"

      # One canonical environment (setup-python + pinned uv + lock venv):
      # ./.github/actions/setup-python-env — same block quality-lint uses.
      - name: Set up Python environment (canonical)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"
          runner-class: ${{ env.NSE_RUNNER_CLASS }}

      # Per-run temp paths for the test DBs (see the job-level env comment:
      # ${{ runner.temp }} is step-only, so this step exports them via
      # $RUNNER_TEMP into $GITHUB_ENV for every later step). Must run
      # before the assert step below and before any pytest/smoke step.
      - name: Pin test DB to ephemeral sqlite paths
        shell: bash
        run: |
          echo "NSE_DATABASE__SQLITE_PATH=$RUNNER_TEMP/nse-ci-audit.sqlite" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nse-ci-audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_SETTINGS_DB=$RUNNER_TEMP/nse-ci-settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$RUNNER_TEMP/nse-ci-data" >> "$GITHUB_ENV"

      # Prove the DB pinning (provider at job level, paths from the pin step
      # above) through the repo's own resolver, before any test or smoke
      # step can open a database. Fails the lane instead of letting it
      # touch a shared database.
      - name: Assert test-database isolation (fail-closed)
        run: python scripts/ci/assert_test_db_isolation.py

      - name: Initialize results tree
        run: |
          python scripts/ci/make_ci_results.py init "$CI_RESULTS_DIR" \
            --json "$CI_RESULTS_DIR/run-info/env-digest.json"

      # -------- Telegram: workflow started (advisory; never fails CI) --------
      - name: Telegram - CI started
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" run-started || true

      # -------- Pytest + coverage (own directory; junit.xml + log + cobertura) --
      - name: Restore trusted native engine (shared cache)
        id: native_cache
        # Layer-B shared cache (mission §7): a portable, trusted build artifact
        # reused across tiers. FORK PRs never reach the self-hosted lanes and
        # never participate in this cache. Restored binaries are VALIDATED
        # (version + selftest) before use — an incompatible entry is a miss.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/ci/native/artifacts/nse-ci-engine
          key: nse-native-v1-${{ runner.os }}-${{ runner.arch }}-0.2.0-${{ hashFiles('scripts/ci/native/**') }}
          fail-on-cache-miss: false

      - name: Build & verify native C17 engine
        id: native
        continue-on-error: true
        run: |
          set -euo pipefail
          # A restored binary wins only if it passes version + selftest.
          if [ -f scripts/ci/native/artifacts/nse-ci-engine ]; then
            if scripts/ci/native/artifacts/nse-ci-engine version | grep -qx "0.2.0" \
               && scripts/ci/native/artifacts/nse-ci-engine selftest >/dev/null; then
              echo "binary=scripts/ci/native/artifacts/nse-ci-engine" >> "$GITHUB_OUTPUT"
              echo "source=restored-trusted-cache" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "restored binary failed verification — rebuilding"
            rm -f scripts/ci/native/artifacts/nse-ci-engine
          fi
          # Self-hosted tiers may not ship cmake. The venv created above is a
          # `uv venv`, which has NO pip inside it, so `python3 -m pip install
          # --user cmake` silently failed on tier-2 (nexus-runner) and the job
          # then died in run_test_plan.py with
          #   FileNotFoundError: [Errno 2] No such file or directory: 'cmake'
          # Install it with uv into the SAME venv that is already on PATH.
          if ! command -v cmake >/dev/null 2>&1; then
            echo "cmake not found — installing the portable wheel via uv"
            uv pip install --quiet cmake || true
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            # uv installs the wheel as a console script in the venv bin dir.
            for d in "${VENV_DIR}/bin" "$PWD/${VENV_DIR}/bin" "$HOME/.local/bin"; do
              [ -x "$d/cmake" ] && export PATH="$d:$PATH" && break
            done
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::error::cmake unavailable on this runner — native C17 planner cannot build; failing closed (never degrade to Python planning)"
            exit 1
          fi
          cmake -S scripts/ci/native -B scripts/ci/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build scripts/ci/native/build -j "$(nproc)"
          scripts/ci/native/build/nse-ci-engine selftest
          mkdir -p scripts/ci/native/artifacts
          cp scripts/ci/native/build/nse-ci-engine scripts/ci/native/artifacts/nse-ci-engine
          echo "binary=scripts/ci/native/artifacts/nse-ci-engine" >> "$GITHUB_OUTPUT"
          echo "source=built-this-run" >> "$GITHUB_OUTPUT"

      - name: Save native engine to trusted cache
        # Policy (cache-by-event table): trusted main pushes and full
        # validations SEED the shared cache; ordinary PRs restore only.
        if: steps.native.outputs.source == 'built-this-run' && (github.ref_name == 'main' || inputs.full == true || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/ci/native/artifacts/nse-ci-engine
          key: nse-native-v1-${{ runner.os }}-${{ runner.arch }}-0.2.0-${{ hashFiles('scripts/ci/native/**') }}

      - name: Planner-driven pytest (C17 only — sole planner)
        id: pytest
        continue-on-error: true
        env:
          NATIVE_BINARY: ${{ steps.native.outputs.binary }}
        run: |
          set +e
          # C17 plans (changed-file driven); Python executes via pytest.
          # targeted on PR/push; full on schedule + full dispatch (policy).
          MODE=targeted
          # 2026-11-10 (user directive): ONE pytest worker on self-hosted
          # tiers. Dubai is 4 cores / 8 GB, and -n 4 measured no speedup
          # there — it only adds memory pressure (a full torch import per
          # worker) and swap thrash on the shared box. 1 worker is enough.
          # Hosted runners keep the core-sized count (capped at 8): they
          # are big ephemeral machines and hosted is last-resort only.
          CORES="$(nproc 2>/dev/null || echo 2)"
          XDIST="$CORES"
          if [ "$XDIST" -gt 8 ]; then XDIST=8; fi
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then XDIST=1; fi
          echo "runner cores: $CORES -> pytest -n $XDIST"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then MODE=full; fi
          # TEMPORARY (2026-11-10, user-approved): coverage is MANUAL-ONLY
          # — it runs only on a manual full dispatch (inputs.full=true).
          # No coverage on PR/push runs (MODE=targeted) and NOT on the
          # schedule either: the tracer inflates pytest past the cap on
          # the shared tier-1 box (expanded suite ~11m with coverage; the
          # OS lane without --cov passed on the same box). The coverage
          # gates below record N/A instead of failing when coverage.xml
          # is absent. Re-enable when the tier-1 suite fits the cap with
          # coverage.
          COV_FLAGS=""
          if [ "${{ inputs.full }}" = "true" ]; then COV_FLAGS="--cov=src --cov-report=xml:$CI_RESULTS_DIR/pytest/coverage.xml"; fi
          # No HTML coverage report on this lane: it costs a full
          # render pass over 784 files and nobody reads htmlcov in CI.
          # Coverage (COV_FLAGS) is TEMPORARILY manual-only (2026-11-10):
          # the xml feeds the critical-file gate on manual full-dispatch
          # runs only, and the coverage gates record N/A when it is absent.
          #
          # NOTE: these comments must stay ABOVE the command, never inside
          # its backslash continuation — a '#' line inside a continuation
          # swallows the rest of the logical line, so --pytest-extra became
          # a stray command and the step died with exit 127 (2026-11-09).
          #
          # --head MUST be the real PR head, not github.sha: on
          # pull_request github.sha is the ephemeral merge commit, which
          # the depth-1 checkout leaves shallow-grafted, so the engine's
          # three-dot diff finds no merge base and fails rc=3 (2026-11-09).
          # The fetch step already fetches this exact SHA.
          #
          # --deselect keeps the WALL-CLOCK budget tests out of this
          # coverage-instrumented run (they run in the dedicated
          # "Performance budget" step right after this one): coverage +
          # xdist on a loaded 2-core runner inflates perf_counter
          # measurements past their floors (gate: 158 us in CI vs ~0.6 us
          # isolated post-optimization; promotion SLA: 511 ms measured once
          # vs its 625 ms limit), so under coverage they measure the
          # scheduler, not the code. The other four tests in the gate file
          # are pure correctness assertions and stay in this run; the
          # promotion node's functional assertions (commit, audit rows)
          # travel with it into the dedicated step.
          # --deselect also keeps the smoke-chain file out: the dedicated
          # "End-to-end smoke chain" step below owns it (it runs on every
          # PR regardless of selection, and gates via the `smoke` check +
          # final gate). Without this the file runs twice in this job —
          # once here (it is in critical_suite.txt) and once there.
          python scripts/ci/run_test_plan.py \
            --repo-root . \
            --base "${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "${{ github.event_name }}" \
            --mode "$MODE" \
            --native-binary "${NATIVE_BINARY}" \
            --xdist "$XDIST" \
            --pytest-extra "--durations=25 $COV_FLAGS --junitxml=$CI_RESULTS_DIR/pytest/junit.xml -q --deselect tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents --deselect tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark --deselect tests/e2e/test_smoke_chain.py" \
            --out-dir "$CI_RESULTS_DIR/test-plan" \
            --runner-name "${{ runner.name }}" \
            --attempt "${{ github.run_attempt }}" \
            2>&1 | tee "$CI_RESULTS_DIR/pytest/pytest.txt"
          rc=${PIPESTATUS[0]}
          # rc: real pytest exit code, or 90 = planner-integrity failure
          # (conservative evidence was still collected above — fail closed).
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" pytest "$rc" "planner-selected execution — see pytest/junit.xml + test-plan/execution-manifest.json" || true
          # Human-readable C17 impact report (colourised + step summary).
          python scripts/ci/ci_plan_report.py \
            --results "$CI_RESULTS_DIR" \
            --plan "$CI_RESULTS_DIR/test-plan/plan.json" || true
          exit $rc

      # -------- Wall-clock performance budget (uninstrumented, single-process)
      # Two tests assert WALL-CLOCK budgets and are deselected from the
      # coverage-instrumented planner run above; they run HERE instead:
      # uninstrumented and single-process, on EVERY PR/push, blocking.
      # (1) payload value-gate cost (perf_counter_ns < 100 us/call);
      # (2) model-promotion transaction SLA (500 ms x 1.25 jitter = 625 ms,
      # single-shot over a real DB write). Measured 2026-11-09: coverage +
      # xdist on a loaded runner inflates wall-clock measurements past
      # their floors (gate: 158 us in CI; promotion: 511 ms measured once
      # against a 500 ms floor). Under coverage + parallelism the
      # assertions measure the scheduler, not the code (same tracer
      # pattern as the MT5 CPU budget). This step fails the job directly
      # on a tripped budget (its own exit code), AND the perf_budget
      # record below is verdict by the quality-tests final gate
      # (ci_final_gate.py CHECKS, --checks list) — two independent
      # enforcements, so a tripped budget can neither pass silently nor
      # be dropped by a workflow edit without the gate test failing.
      # The record also feeds the step summary + review-status.
      # It has deliberately NO if: and NO continue-on-error (pinned by
      # tests/ci/test_pr_policy_benchmark_lane.py).
      - name: Performance budget — wall-clock budgets (uninstrumented)
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR/perf-budget"
          pytest tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark \
            -q --tb=short -p no:cacheprovider \
            --junitxml="$CI_RESULTS_DIR/perf-budget/junit.xml" \
            2>&1 | tee "$CI_RESULTS_DIR/perf-budget/pytest.txt"
          rc=${PIPESTATUS[0]}
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" perf_budget "$rc" "wall-clock budgets uninstrumented single-process (gate < 100us/call, promotion < 625ms; see perf-budget/)" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::wall-clock budget tripped while UNINSTRUMENTED — the code itself got slower (see perf-budget/junit.xml)"
            exit "$rc"
          fi
          grep -h "gate cost" "$CI_RESULTS_DIR/perf-budget/pytest.txt" || true
          echo "perf-budget: PASS (wall-clock budgets hold, uninstrumented)"

      # -------- Whole-application SMOKE CHAIN (one-file E2E heartbeat) --------
      - name: End-to-end smoke chain
        id: smoke
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR/smoke"
          pytest tests/e2e/test_smoke_chain.py \
                 -q --tb=short \
                 --junitxml="$CI_RESULTS_DIR/smoke/junit.xml" \
                 > "$CI_RESULTS_DIR/smoke/pytest.txt" 2>&1
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" smoke "$rc" "whole-app smoke chain (tests/e2e/test_smoke_chain.py)" || true
          exit 0

      # -------- Coverage status (derived from the same pytest run above) --------
      - name: Coverage report
        id: coverage
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' || true
          import json, os, re
          root = os.environ["CI_RESULTS_DIR"]
          pct = None
          # TEMPORARY (2026-11-10): coverage is manual-only, so no
          # coverage.xml is produced on PR/push/schedule runs. That
          # absence is intentional — record N/A (passing, explicit)
          # instead of "errored". The pytest check itself still fails the
          # job if pytest failed, so nothing is hidden. Manual full
          # dispatch runs keep coverage and take the normal path below.
          skipped = not os.path.isfile(os.path.join(root, "pytest", "coverage.xml"))
          log_path = os.path.join(root, "pytest", "pytest.txt")
          try:
              with open(log_path, encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      m = re.search(r"TOTAL\s+\d+\s+\d+\s+(\d+)%", line)
                      if m:
                          pct = float(m.group(1))
          except Exception:
              pass
          if skipped:
              status = "passed"
              detail = "coverage is manual-only (temporary 2026-11-10) — run a full dispatch to measure it"
          else:
              status = "passed" if pct is not None else "errored"
              detail = f"{pct:.1f}% line coverage" if pct is not None else "coverage% not found in log"
          payload = {
              "check": "coverage",
              "status": status,
              "exit_code": 0,
              "detail": detail,
              "percent": pct,
          }
          with open(os.path.join(root, "run-info", "coverage.json"), "w") as fh:
              json.dump(payload, fh)
          with open(os.path.join(root, "run-info", "coverage-extra.json"), "w") as fh:
              json.dump({"percent": pct}, fh)
          print(f"coverage={pct}")
          PY
          exit 0

      # -------- Critical-file coverage gate (QA hardening, P1) --------
      # NO_DATA on a critical file also fails: silence is not coverage.
      - name: Critical-file coverage gate
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR/coverage"
          # TEMPORARY (2026-11-10): coverage is manual-only, so there is
          # no coverage.xml to gate on. Record N/A (passing, explicit) —
          # per-file floors are enforced on manual full-dispatch runs
          # (schedule / full dispatch), same as for targeted plans.
          if [ ! -f "$CI_RESULTS_DIR/pytest/coverage.xml" ]; then
            python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" critical_coverage 0 "coverage is manual-only (temporary 2026-11-10) — per-file floors enforced on manual full-dispatch runs" || true
            echo "critical-file coverage gate: NOT APPLICABLE (no coverage data; floors enforced in full runs)"
            exit 0
          fi
          # CI quota diet + planner integration: a TARGETED plan executes a
          # deliberate SUBSET — per-file floors are enforced in full
          # validation runs (schedule / full dispatch) only, and the N/A is
          # recorded explicitly rather than silently skipped.
          PLAN_MODE="expanded"
          PLAN_FILE="$CI_RESULTS_DIR/test-plan/plan.json"
          if [ -f "$PLAN_FILE" ]; then
            PLAN_MODE=$(python3 -c "import json;print(json.load(open('$PLAN_FILE')).get('selection_mode','expanded'))" 2>/dev/null || echo expanded)
          fi
          if [ "$PLAN_MODE" = "targeted" ]; then
            python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" critical_coverage 0 "targeted plan — per-file floors enforced in full validation runs" || true
            echo "critical-file coverage gate: NOT APPLICABLE (targeted plan; floors enforced in full runs)"
            exit 0
          fi
          python scripts/ci/critical_manifest.py --coverage "$CI_RESULTS_DIR/pytest/coverage.xml" --report-only > "$CI_RESULTS_DIR/coverage/critical-gate.txt" 2>&1
          rc=$?
          cat "$CI_RESULTS_DIR/coverage/critical-gate.txt"
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" critical_coverage "$rc" "per-file floors on execution-critical modules (see coverage/critical-gate.txt)" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::critical-file coverage gate failed (see critical-gate.txt)"
            exit 1
          fi
          exit 0

      # -------- The PostgreSQL arms do NOT run here (migrated-server contract).
      # Recorded as an explicit status instead of a silent skip.
      - name: PostgreSQL arms - not run on this runner (reported)
        run: |
          {
            echo '### PostgreSQL arms'
            echo ''
            echo '- Status: **NOT RUN** on GitHub CI - no migrated server on the runner.'
            echo '- They run in the local gate: `python scripts/ci/check_local.py --pg`'
            echo '- A skip here is NOT a pass and is not counted as one.'
          } >> "$GITHUB_STEP_SUMMARY"

      # -------- Runtime certification gate (CHG-0051) --------
      - name: Runtime certification gate
        id: runtime_gate
        continue-on-error: true
        run: |
          set +e
          python scripts/ci/runtime_gate.py --json > "$CI_RESULTS_DIR/runtime_gate.json" 2> "$CI_RESULTS_DIR/runtime_gate.log"
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" runtime_gate "$rc" "see runtime_gate.json + runtime_gate.log" || true
          exit 0

      # -------- Layered E2E smoke — fast tier --------
      - name: Layered smoke (fast)
        id: layered-smoke
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$CI_RESULTS_DIR/layered-smoke"
          python -m nexus_scalp.cli.main smoke --fast --json > "$CI_RESULTS_DIR/layered-smoke/smoke.json" 2> "$CI_RESULTS_DIR/layered-smoke/smoke.log"
          rc=$?
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" layered_smoke "$rc" "layered E2E smoke fast tier (nse smoke --fast)" || true
          exit 0

      # -------- Aggregate: step summary + manifest + checksums --------
      - name: Generate CI summary (step summary + summary.md)
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' || true
          import json, os
          import xml.etree.ElementTree as ET
          root = os.environ["CI_RESULTS_DIR"]
          junit = os.path.join(root, "pytest", "junit.xml")
          detail = ""
          try:
              tree = ET.parse(junit)
              r = tree.getroot()
              nodes = r.findall("testsuite") if r.tag == "testsuites" else [r]
              tests = failures = skipped = 0
              for node in nodes:
                  tests += int(node.attrib.get("tests", 0) or 0)
                  failures += int(node.attrib.get("failures", 0) or 0) + int(node.attrib.get("errors", 0) or 0)
                  skipped += int(node.attrib.get("skipped", 0) or 0)
              detail = f"{tests} tests, {failures} failed, {skipped} skipped"
          except Exception:
              detail = "no junit.xml produced"
          with open(os.path.join(root, "run-info", "pytest-extra.json"), "w") as fh:
              json.dump({"detail": detail}, fh)
          print(detail)
          PY
          python scripts/ci/make_ci_results.py summary "$CI_RESULTS_DIR" || true
          python scripts/ci/make_ci_results.py manifest "$CI_RESULTS_DIR" || true
          python - <<'PY' || true
          import json, os
          root = os.environ["CI_RESULTS_DIR"]
          info_dir = os.path.join(root, "run-info")

          def load(name):
              try:
                  with open(os.path.join(info_dir, name), encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}

          checks = {
              "Pytest": load("pytest.json").get("status", "skipped"),
              "Smoke chain": load("smoke.json").get("status", "skipped"),
              "Coverage": load("coverage.json").get("status", "skipped"),
              "Critical coverage": load("critical_coverage.json").get("status", "skipped"),
              "Runtime gate": load("runtime_gate.json").get("status", "skipped"),
              "Layered Smoke": load("layered_smoke.json").get("status", "skipped"),
              "Perf budget": load("perf_budget.json").get("status", "skipped"),
          }
          meta = load("metadata.json")
          extra = load("pytest-extra.json")
          cov = load("coverage-extra.json").get("percent")
          lines = ["## Quality — Tests & Runtime Certification", ""]
          for name, status in checks.items():
              lines.append(f"- {name}: **{status.upper()}**")
          lines.append("")
          lines.append(extra.get("detail", "Tests: n/a"))
          if cov is not None:
              lines.append(f"Coverage: {cov:.1f}%")
          lines.append("")
          lines.append(f"Artifact: `{meta.get('artifact', 'ci-results-*')}` (30-day retention)")
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          PY
          exit 0

      # -------- Failure summary IN THE JOB LOG (CI-FAILSUM-001) --------
      - name: Print failure summary to job log
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/ci_failure_summary.py --results "$CI_RESULTS_DIR"

      # -------- Telegram: run finished (advisory; never fails CI) --------
      - name: Telegram - CI finished
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" run-finished || true
          python scripts/ci/telegram_notify.py --results "$CI_RESULTS_DIR" artifacts || true

      # -------- One canonical artifact per run --------
      # This is the run's canonical ci-results artifact on normal pushes.
      - name: Upload CI results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-quality-${{ github.workflow }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

      # -------- Machine-readable review status (one predictable schema) -------
      - name: Emit review-status.json
        if: always()
        run: |
          python - <<'PY'
          import json, os, time
          root = os.environ["CI_RESULTS_DIR"]
          info_dir = os.path.join(root, "run-info")
          def load(name):
              try:
                  with open(os.path.join(info_dir, name), encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}
          checks = ["pytest", "smoke", "coverage", "critical_coverage", "runtime_gate", "layered_smoke", "perf_budget"]
          details = []
          status = "passed"
          for c in checks:
              d = load(c + ".json")
              s = d.get("status", "skipped")
              if s in ("failed", "errored"):
                  status = "failed"
              details.append({"check": c, "status": s, "detail": d.get("detail", "")})
          payload = {
              "job": "quality-tests",
              "status": status,
              "workflow": os.environ.get("GITHUB_WORKFLOW", "CI"),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "details": details,
          }
          os.makedirs(info_dir, exist_ok=True)
          with open(os.path.join(info_dir, "review-status.json"), "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          print("review-status.json ->", status)
          PY

      # -------- Final gate: fail-closed over THIS lane's checks -------
      - name: Fail job if any check failed (fail-closed)
        if: always()
        run: python scripts/ci/ci_final_gate.py --checks pytest,smoke,coverage,critical_coverage,runtime_gate,layered_smoke,perf_budget

  quality:
    name: Code Quality & Tests
    if: always()
    needs:
      - quality-lint
      - quality-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require both quality lanes to pass (fail-closed on skip/cancel)
        run: |
          echo "Lint/types/static lane: ${{ needs.quality-lint.result }}"
          echo "Tests/runtime lane:     ${{ needs.quality-tests.result }}"
          if [ "${{ needs.quality-lint.result }}" != "success" ]; then
            echo "::error::Quality lint/types/static lane failed (${{ needs.quality-lint.result }}) — a skipped lane is NOT a pass"
            exit 1
          fi
          if [ "${{ needs.quality-tests.result }}" != "success" ]; then
            echo "::error::Quality tests/runtime lane failed (${{ needs.quality-tests.result }}) — a skipped lane is NOT a pass"
            exit 1
          fi
          echo "QUALITY CERTIFICATION: PASS"

  # ---------------------------------------------------------------------------
  # FULL REAL-PROCESS RUNTIME — SQLite + PostgreSQL matrix.
  # Each matrix leg launches NexusTradingForexBot.py itself in PAPER mode,
  # keeps the real engine + FastAPI process alive for >=120 seconds, performs
  # a large bounded read-only query workload (>=500 queries), checks live API
  # endpoints, captures and traces warnings/errors/tracebacks, then requires
  # graceful process shutdown. This is deliberately not TestClient smoke.
  # ---------------------------------------------------------------------------
  full-runtime-provider:
    name: Full NSE Runtime (${{ matrix.provider }})
    # CI quota diet (2026-11): these legs need Docker service containers
    # (postgres) and ~25 hosted-minutes per run — they are the single
    # largest burn on every PR/push. They now run on the SEMI-MONTHLY
    # schedule and on explicit full dispatch only; the fail-closed verdict
    # below treats a policy skip on PR/push as expected, never as a pass.
    if: always() && (github.event_name == 'schedule' || inputs.full == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgres]

    env:
      NSE_PG_TEST_PASSWORD: nse_password_dev
      NSE_DATABASE__PG_HOST: 127.0.0.1
      NSE_DATABASE__PG_PORT: "5432"
      NSE_DATABASE__PG_DATABASE: nse_audit
      NSE_DATABASE__PG_USER: nse_user
      NSE_RUNTIME_SOAK_PORT: "18080"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv (pinned — the canonical lock tool)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install via lock (hash-verified requirements.lock)
        run: |
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Prepare isolated provider environment
        run: |
          root="$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"
          mkdir -p "$root"
          echo "NEXUS_SETTINGS_DB=$root/app_settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$root/audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$root/data" >> "$GITHUB_ENV"
          echo "NSE_EXECUTION__MODE=PAPER" >> "$GITHUB_ENV"
          echo "NSE_EXECUTION__SYMBOL=XAUUSD" >> "$GITHUB_ENV"
          echo "NSE_NO_BROWSER=1" >> "$GITHUB_ENV"
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "NSE_TELEGRAM__ENABLED=true" >> "$GITHUB_ENV"
            echo "NSE_NO_TELEGRAM=0" >> "$GITHUB_ENV"
            echo "NEXUS_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> "$GITHUB_ENV"
            echo "NEXUS_TELEGRAM_ADMIN_ID=${TELEGRAM_CHAT_ID}" >> "$GITHUB_ENV"
          else
            echo "NSE_NO_TELEGRAM=1" >> "$GITHUB_ENV"
            echo "NSE_TELEGRAM__ENABLED=false" >> "$GITHUB_ENV"
          fi
          echo "NSE_NEWS__ENABLED=false" >> "$GITHUB_ENV"
          echo "NSE_NO_AUTO_INSTALL=1" >> "$GITHUB_ENV"
          echo "NSE_WEB_ACTUAL_PORT=$NSE_RUNTIME_SOAK_PORT" >> "$GITHUB_ENV"
          if [ "${{ matrix.provider }}" = "postgres" ]; then
            echo "NSE_DATABASE__PROVIDER=postgresql" >> "$GITHUB_ENV"
          else
            echo "NSE_DATABASE__PROVIDER=sqlite" >> "$GITHUB_ENV"
            echo "NSE_DATABASE__SQLITE_PATH=$root/audit.sqlite" >> "$GITHUB_ENV"
          fi

      - name: Start disposable PostgreSQL
        if: matrix.provider == 'postgres'
        run: |
          set -euo pipefail
          docker rm -f nse-ci-pg >/dev/null 2>&1 || true
          docker run -d --name nse-ci-pg \
            -e POSTGRES_DB=nse_audit \
            -e POSTGRES_USER=nse_user \
            -e POSTGRES_PASSWORD="$NSE_PG_TEST_PASSWORD" \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 40); do
            if docker exec nse-ci-pg pg_isready -U nse_user -d nse_audit >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nse-ci-pg | tail -100 || true
          echo "::error::PostgreSQL service did not become ready"
          exit 1

      - name: Provision and certify runtime model
        run: |
          python scripts/ci/runtime_gate.py --json --evidence

      - name: Boot full NSE process + 120s soak + query workload
        run: |
          python scripts/ci/provider_runtime_soak.py \
            --provider "${{ matrix.provider }}" \
            --duration 120 \
            --port "$NSE_RUNTIME_SOAK_PORT" \
            --evidence-dir "$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"

      - name: Print full runtime warnings, errors, tracebacks and query verdict
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "nse-full-runtime-${{ matrix.provider }}"
          report = {}
          query = {}
          for name, target in (("report", root / "full_runtime_report.json"), ("query", root / "query_matrix.json")):
              try:
                  payload = json.loads(target.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"{name.upper()}_REPORT_ERROR: {type(exc).__name__}: {exc}")
                  continue
              if name == "report":
                  report = payload
              else:
                  query = payload
          diag = report.get("diagnostics", {})
          rc = report.get("process_exit_code")
          print("=" * 60)
          print("=== FULL RUNTIME REPORT: ${{ matrix.provider }} ===")
          print("=" * 60)
          print("STATUS:", report.get("status", "FAIL"))
          print("CONFIG:", report.get("config_path", "unknown"))
          print("SOAK_SECONDS:", report.get("elapsed_sec", "n/a"))
          print("PROCESS_RC:", rc if rc is not None else "0 (alive)")
          print("QUERIES:", f"{query.get('queries_ok', 0)}/{query.get('queries_total', 0)}")
          print("QUERY_FAILURES:", query.get("queries_failed", 0))
          print("QUERY_FLOOR:", query.get("minimum_query_floor", "n/a"))
          print("QUERY_FLOOR_MET:", query.get("query_floor_met", False))
          print("WARNINGS:", diag.get("warning_count", 0))
          print("ERRORS:", diag.get("error_count", 0))
          print("TRACEBACKS:", diag.get("traceback_count", 0))
          if report.get("runtime_error"):
              print("RUNTIME_ERROR:", report["runtime_error"])

          if rc not in (0, None):
              print("\n" + "!" * 60)
              print(f"💥 CRASH DETECTED: Engine process exited with code {rc}!")
              print("!" * 60)
              log_file = root / "runtime.log"
              if log_file.exists():
                  print("\n--- [LAST 50 LINES OF RUNTIME LOG] ---")
                  lines = log_file.read_text(encoding="utf-8", errors="replace").splitlines()
                  print("\n".join(lines[-50:]))
          else:
              print(f"\n✅ Engine process remained ALIVE for the full {report.get('elapsed_sec', 'n/a')}s soak window.")
              if diag.get("warning_count", 0) > 0 or diag.get("error_count", 0) > 0:
                  print(f"⚠️ Process ran successfully but recorded {diag.get('warning_count', 0)} warning(s) and {diag.get('error_count', 0)} error(s).")

          tracebacks = diag.get("tracebacks", [])
          if tracebacks:
              print("\n" + "=" * 60)
              print(f"=== FULL TRACEBACKS ({len(tracebacks)}) ===")
              print("=" * 60)
              for idx, trace in enumerate(tracebacks[:25], 1):
                  lines = trace.get("lines", [])
                  print(f"\n--- [TRACEBACK #{idx}] lines {trace.get('start_line_no')}-{trace.get('end_line_no')} ---")
                  if lines:
                      print("\n".join(lines))
                  else:
                      frames = " -> ".join(
                          f"{frame['file']}:{frame['line']}" +
                          (f"::{frame['function']}" if frame.get("function") else "")
                          for frame in trace.get("frames", [])
                      )
                      print(frames or "no parsed frames")

          warnings = diag.get("warnings", [])
          if warnings:
              print("\n--- [WARNINGS] ---")
              for item in warnings[:50]:
                  print(f"[WARN] line={item.get('line_no', '?')} {item.get('message', item.get('error', ''))}")

          errors = diag.get("errors", [])
          if errors:
              print("\n--- [ERRORS] ---")
              for item in errors[:50]:
                  print(f"[ERROR] line={item.get('line_no', '?')} {item.get('message', item.get('error', ''))}")

          query_fails = query.get("failure_samples", [])
          if query_fails:
              print("\n--- [QUERY FAILURES] ---")
              for item in query_fails[:50]:
                  print(f"[QUERY-FAIL] {item.get('label', 'unknown')}: {item.get('error', '')}")
          print("\n" + "=" * 60)
          PY

      - name: Emit GitHub runtime annotations
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/render_provider_runtime.py \
            --evidence "$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}/provider_runtime_soak.json"

      - name: Upload full runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-full-runtime-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/full_runtime_report.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/query_matrix.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/provider_runtime_soak.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/runtime.log
            ${{ runner.temp }}/nse-runtime-${{ matrix.provider }}/audit.db
            artifacts/models/scalp/XAUUSD/70d_liquidity/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup PostgreSQL
        if: always() && matrix.provider == 'postgres'
        run: docker rm -f nse-ci-pg >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # DATABASE FABRIC CERTIFICATION — real UI-driven SQLite -> PostgreSQL -> SQLite.
  # Uses the SQLite audit DB produced by the full real-process runtime lane,
  # starts a disposable PostgreSQL, and exercises the same HTTP workflow the
  # Database Management UI uses: config -> connection test -> preview ->
  # migration -> validation -> automatic cutover -> restart -> reverse migration
  # -> switch back -> restart. The same bounded query corpus runs statement by
  # statement against both providers and a small p95 benchmark is recorded.
  # This is a certification lane, not a load test.
  # ---------------------------------------------------------------------------
  db-fabric-certification:
    name: DB Fabric Certification (SQLite ↔ PostgreSQL)
    if: always() && needs.full-runtime-provider.result == 'success'
    needs:
      - full-runtime-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      NSE_PG_TEST_PASSWORD: nse_password_dev
      NSE_DATABASE__PG_HOST: 127.0.0.1
      NSE_DATABASE__PG_PORT: "5432"
      NSE_DATABASE__PG_DATABASE: nse_audit
      NSE_DATABASE__PG_USER: nse_user

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv (pinned — the canonical lock tool)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install via lock (hash-verified requirements.lock)
        run: |
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Download SQLite runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-full-runtime-sqlite-*
          path: ${{ runner.temp }}/db-fabric/input
          merge-multiple: true

      - name: Restore certified model bundle from SQLite runtime lane
        run: |
          set -euo pipefail
          model_pt="$(find "$RUNNER_TEMP/db-fabric/input" -type f -name model.pt -print -quit)"
          test -n "$model_pt"
          model_dir="$(dirname "$model_pt")"
          target="artifacts/models/scalp/XAUUSD/70d_liquidity"
          mkdir -p "$target"
          cp "$model_dir"/* "$target"/

      - name: Locate SQLite audit database
        run: |
          set -euo pipefail
          sqlite_db="$(find "$RUNNER_TEMP/db-fabric/input" -type f -name audit.db -print -quit)"
          test -n "$sqlite_db"
          echo "SQLITE_RUNTIME_DB=$sqlite_db" >> "$GITHUB_ENV"

      - name: Start disposable PostgreSQL 16
        run: |
          set -euo pipefail
          docker rm -f nse-db-fabric-pg >/dev/null 2>&1 || true
          docker run -d --name nse-db-fabric-pg \
            -e POSTGRES_DB=nse_audit \
            -e POSTGRES_USER=nse_user \
            -e POSTGRES_PASSWORD="$NSE_PG_TEST_PASSWORD" \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 45); do
            if docker exec nse-db-fabric-pg pg_isready -U nse_user -d nse_audit >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nse-db-fabric-pg | tail -120 || true
          exit 1


      - name: Prepare deterministic market data
        run: |
          python - <<'PY'
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          import polars as pl

          path = Path("data/raw/XAUUSD_M1.parquet")
          path.parent.mkdir(parents=True, exist_ok=True)
          start = datetime(2026, 1, 1, tzinfo=UTC)
          n = 20000
          close = [2000.0 + ((i % 200) - 100) * 0.02 + (i % 17) * 0.003 for i in range(n)]
          pl.DataFrame({
              "time_utc": [start + timedelta(minutes=i) for i in range(n)],
              "open": close,
              "high": [v + 0.15 for v in close],
              "low": [v - 0.15 for v in close],
              "close": [v + (0.01 if i % 2 else -0.01) for i, v in enumerate(close)],
              "tick_volume": [100 + (i % 31) for i in range(n)],
          }).write_parquet(path)
          PY

      - name: Run end-to-end DB fabric certification with full trace
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/db-fabric/evidence"
          log="$RUNNER_TEMP/db-fabric/certification.log"

          # Stream complete Python stdout/stderr to Actions and persist the exact
          # same stream. Capture the Python exit code explicitly.
          set +e
          set -x
          python -u scripts/ci/db_fabric_certification.py \
            --sqlite-db "$SQLITE_RUNTIME_DB" \
            --settings-db "$RUNNER_TEMP/db-fabric/settings.db" \
            --evidence-dir "$RUNNER_TEMP/db-fabric/evidence" \
            --port 18090 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set +x

          echo "DB_FABRIC_CERTIFICATION_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "=== DB FABRIC STRUCTURED FAILURE ==="
            python - <<'PY' || true
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "db-fabric" / "evidence" / "db_fabric_certification.json"
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
              print(json.dumps({
                  "status": data.get("status"),
                  "errors": data.get("errors"),
                  "phases": data.get("phases"),
                  "final_count_diffs": data.get("final_count_diffs"),
                  "preserved_sqlite_diffs": data.get("preserved_sqlite_diffs"),
                  "final_schema_compare": data.get("final_schema_compare"),
                  "traceback": data.get("traceback"),
              }, indent=2, sort_keys=True, default=str))
          else:
              print("certification evidence file was not produced")
          PY
            echo "=== CERTIFICATION LOG: LAST 500 LINES ==="
            tail -n 500 "$log" || true
            echo "=== CERTIFICATION LOG: ERROR/FAIL FILTER ==="
            grep -Ein 'error|fail|exception|traceback|mismatch|does not exist|cannot' "$log" | tail -n 250 || true
            echo "=== APPLICATION LOG TAILS ==="
            for f in "$RUNNER_TEMP"/db-fabric/db-fabric-*.log "$RUNNER_TEMP"/db-fabric/evidence/db-fabric-*.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              tail -n 500 "$f" || true
            done
            exit "$rc"
          fi

      - name: Run deep SQLite provider query certification
        run: |
          set -euo pipefail
          export NEXUS_AUDIT_DB="$RUNNER_TEMP/db-fabric/evidence/certification.sqlite"
          export NSE_DATABASE__PROVIDER=sqlite
          mkdir -p "$RUNNER_TEMP/db-fabric/evidence/ci-db-cert-sqlite"
          python scripts/ci/database_provider_cert.py \
            --provider sqlite \
            --evidence-dir "$RUNNER_TEMP/db-fabric/evidence/ci-db-cert-sqlite"

      - name: Run deep PostgreSQL provider query certification
        run: |
          set -euo pipefail
          unset NEXUS_AUDIT_DB || true
          export NSE_DATABASE__PROVIDER=postgresql
          export NSE_DATABASE__PG_HOST=127.0.0.1
          export NSE_DATABASE__PG_PORT=5432
          export NSE_DATABASE__PG_DATABASE=nse_audit
          export NSE_DATABASE__PG_USER=nse_user
          export HOME="$RUNNER_TEMP/db-fabric/home"
          mkdir -p "$HOME"
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from nexus_scalp.database.config import PG_PASSWORD_SECRET_KEY
          from nexus_scalp.settings.secret_store import SecureSecretStore
          SecureSecretStore().set_secret(PG_PASSWORD_SECRET_KEY, os.environ["NSE_PG_TEST_PASSWORD"])
          PY
          mkdir -p "$RUNNER_TEMP/db-fabric/evidence/ci-db-cert-postgres"
          python scripts/ci/database_provider_cert.py \
            --provider postgres \
            --evidence-dir "$RUNNER_TEMP/db-fabric/evidence/ci-db-cert-postgres"

      - name: Compare SQLite/PostgreSQL live schema and query contract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-fabric/evidence/ci-db-cert-root"
          export DB_CERT_ROOT="$RUNNER_TEMP/db-fabric/evidence"
          python scripts/ci/database_provider_parity.py \
            --evidence-dir "$DB_CERT_ROOT"

      - name: Run production migrator deep round-trip certification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-fabric/evidence/ci-migration-cert"
          python scripts/ci/database_migration_cert.py \
            --evidence-dir "$RUNNER_TEMP/db-fabric/evidence/ci-migration-cert"

      - name: Enforce deep DB certification contract and emit benchmark
        run: |
          set -euo pipefail
          export DB_CERT_ROOT="$RUNNER_TEMP/db-fabric/evidence"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DB_CERT_ROOT"])
          sqlite_report = json.loads((root / "ci-db-cert-sqlite" / "database_provider_cert.json").read_text())
          postgres_report = json.loads((root / "ci-db-cert-postgres" / "database_provider_cert.json").read_text())
          parity = json.loads((root / "provider_parity.json").read_text())
          migration = json.loads((root / "ci-migration-cert" / "database_migration_cert.json").read_text())

          checks = {
              "sqlite_provider_cert_pass": sqlite_report.get("status") == "PASS",
              "postgres_provider_cert_pass": postgres_report.get("status") == "PASS",
              "sqlite_query_floor_350": int(sqlite_report.get("workload", {}).get("query_count", 0)) >= 350,
              "postgres_query_floor_350": int(postgres_report.get("workload", {}).get("query_count", 0)) >= 350,
              "sqlite_query_failures_zero": int(sqlite_report.get("workload", {}).get("failed", 1)) == 0,
              "postgres_query_failures_zero": int(postgres_report.get("workload", {}).get("failed", 1)) == 0,
              "every_sqlite_table_exists_in_postgres": bool(
                  parity.get("checks", {}).get("sqlite_has_no_missing_postgres_tables")
              ),
              "shared_columns_equal": bool(parity.get("checks", {}).get("same_column_contract")),
              "postgres_only_data_free": bool(
                  parity.get("checks", {}).get("postgres_only_tables_are_empty")
              ),
              "migration_cert_pass": migration.get("status") == "PASS",
              "migration_roundtrip_digest": bool(migration.get("digest_match")),
              "migration_idempotent": bool(migration.get("idempotent_forward_pass")),
          }

          benchmark = {
              "sqlite_mean_ms": sqlite_report.get("workload", {}).get("mean_ms"),
              "sqlite_p95_ms": sqlite_report.get("workload", {}).get("p95_ms"),
              "postgres_p95_ms": postgres_report.get("workload", {}).get("p95_ms"),
              "postgres_max_ms": postgres_report.get("workload", {}).get("max_ms"),
              "sqlite_query_count": sqlite_report.get("workload", {}).get("query_count"),
              "postgres_query_count": postgres_report.get("workload", {}).get("query_count"),
              "migration_elapsed_ms": migration.get("elapsed_ms"),
          }

          result = {
              "status": "PASS" if all(checks.values()) else "FAIL",
              "checks": checks,
              "benchmark": benchmark,
          }
          (root / "deep_db_certification_overall.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = "## Deep DB Fabric Certification\n\n"
          summary += "| Check | Result |\n|---|---|\n"
          for name, ok in checks.items():
              summary += f"| {name} | {'PASS' if ok else 'FAIL'} |\n"
          summary += "\n### Approximate benchmark\n"
          for name, value in benchmark.items():
              summary += f"- {name}: {value}\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)

          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Print DB fabric diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "=== DB FABRIC DIAGNOSTIC SUMMARY ==="
          if [ -f "$RUNNER_TEMP/db-fabric/evidence/db_fabric_certification.json" ]; then
            python - <<'PY' || true
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "db-fabric" / "evidence" / "db_fabric_certification.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "status": data.get("status"),
              "errors": data.get("errors"),
              "phases": data.get("phases"),
              "final_count_diffs": data.get("final_count_diffs"),
              "preserved_sqlite_diffs": data.get("preserved_sqlite_diffs"),
              "final_schema_compare": data.get("final_schema_compare"),
              "shutdown": data.get("shutdown"),
          }, indent=2, sort_keys=True, default=str))
          PY
          fi
          echo "=== CERTIFICATION LOG TAIL ==="
          tail -n 500 "$RUNNER_TEMP/db-fabric/certification.log" 2>/dev/null || true
          echo "=== APPLICATION WARN/ERROR TAILS ==="
          for f in "$RUNNER_TEMP"/db-fabric/db-fabric-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -Ein 'warn|error|critical|exception|fatal|failed|cannot|mismatch' "$f" | tail -n 250 || true
          done
          echo "=== POSTGRES CONTAINER LOG (TAIL) ==="
          docker logs --tail 250 nse-db-fabric-pg 2>&1 || true
          echo "=== PROCESS SNAPSHOT ==="
          ps -ef | grep -E 'nexus|uvicorn|python|postgres' | grep -v grep || true

      - name: Upload DB fabric evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-db-fabric-certification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/db-fabric/evidence/
            ${{ runner.temp }}/db-fabric/certification.log
            ${{ runner.temp }}/db-fabric/db-fabric-*.log
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup PostgreSQL
        if: always()
        run: docker rm -f nse-db-fabric-pg >/dev/null 2>&1 || true

  full-runtime-verdict:
    name: Full Runtime Overall Verdict
    if: always()
    needs:
      - full-runtime-provider
      - mt5-native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download provider runtime evidence
        # CI quota diet (2026-11): evidence exists only when the provider
        # matrix actually ran (schedule / full dispatch). On a policy skip
        # these steps must not run — download/aggregate/upload would fail
        # on empty inputs before the verdict step below gets its say.
        if: always() && needs.full-runtime-provider.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-full-runtime-*
          path: full-runtime-results
          merge-multiple: false

      - name: Aggregate provider warnings, errors, traces and query counts
        if: always() && needs.full-runtime-provider.result == 'success'
        continue-on-error: true
        run: |
          python scripts/ci/aggregate_provider_runtime.py \
            --root full-runtime-results \
            --output runtime-provider-overall.json

      - name: Upload provider overall runtime evidence
        if: always() && needs.full-runtime-provider.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-provider-runtime-overall-${{ github.run_id }}
          path: runtime-provider-overall.json
          if-no-files-found: error
          retention-days: 14

      - name: Require every runtime line to pass
        run: |
          echo "SQLite/PostgreSQL matrix:   ${{ needs.full-runtime-provider.result }}"
          echo "MT5 native Windows line:    ${{ needs.mt5-native.result }}"
          # Wine is a compatibility platform (mt5-wine-compat.yml, monthly +
          # dispatch) and is deliberately NOT part of this verdict: a Wine
          # failure can never block a PR, this aggregate, or a release.
          # CI quota diet (2026-11): the provider matrix is gated to the
          # semi-monthly schedule and full dispatch (Docker service
          # containers cannot run on the self-hosted tiers). A skipped
          # matrix on PR/push is EXPECTED policy — never a pass, never a
          # failure; on the events where the leg is required, any
          # non-success still fails this verdict fail-closed.
          if [ "${{ needs.full-runtime-provider.result }}" != "success" ] && [ "${{ needs.full-runtime-provider.result }}" != "skipped" ]; then
            echo "::error::Full SQLite/PostgreSQL runtime matrix failed"
            exit 1
          fi
          if [ "${{ needs.full-runtime-provider.result }}" = "skipped" ]; then
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
              echo "::error::Full runtime matrix skipped on an event that requires it (schedule/full dispatch)"
              exit 1
            fi
            echo "::notice::Full NSE runtime matrix skipped by policy on ${{ github.event_name }} — runs on the semi-monthly schedule or via dispatch with full=true."
          fi
          # CI runner-routing architecture (2026-11): the MT5 native line is
          # scheduled/dispatch-only (Windows is excluded from automatic CI).
          # A skipped MT5 line is therefore EXPECTED on PR/push and must not
          # fail this verdict; on schedule/dispatch the leg runs and a
          # non-success result (incl. a failure) still fails it.
          if [ "${{ needs.mt5-native.result }}" != "success" ] && [ "${{ needs.mt5-native.result }}" != "skipped" ]; then
            echo "::error::MetaTrader 5 native Windows IPC certification failed"
            exit 1
          fi
          if [ "${{ needs.mt5-native.result }}" = "skipped" ]; then
            echo "::notice::MT5 native line skipped (Windows is manual-only on PR/push). Run it via Actions → mt5-native-windows.yml → Run workflow."
          fi
          echo "FULL RUNTIME CERTIFICATION: PASS"

  # ---------------------------------------------------------------------------
  # NATIVE WINDOWS MT5 — the genuine Win32 IPC certification line
  # (reusable workflow, see .github/workflows/mt5-native-windows.yml).
  # Authenticode-verified official installer + real mt5.initialize() IPC +
  # DirectMT5Adapter.connect() on a windows-latest runner, with NO broker
  # credentials. Demo (Level 2/3) legs are dispatch-only and never run here.
  #
  # CI runner-routing architecture (2026-11): Windows is excluded from
  # AUTOMATIC CI, so this leg no longer runs on ordinary PR/push events.
  # The MT5 infrastructure is fully preserved and runs on schedule and
  # manual dispatch. `Full Runtime Overall Verdict` below tolerates a
  # skipped MT5 line on PR/push (it still requires the provider matrix)
  # and requires MT5 success on the events where the leg actually runs.
  # ---------------------------------------------------------------------------
  mt5-native:
    name: MetaTrader 5 Native Windows IPC
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/mt5-native-windows.yml
    permissions:
      contents: read
    secrets: inherit
  # ---------------------------------------------------------------------------
  # TIER 2 — EXTENDED validation (brief section 19). Runs on MAIN PUSH
  # (post-merge evidence) and explicit dispatch, never on the PR lane. Holds
  # the production-truth tests whose MEASURED wall cost (bug276 1252s,
  # perf_deadletter 730s, news_truncation 428s aggregate worker-seconds) does
  # not earn a spot in the sub-5-minute PR gate — but they are NOT dropped;
  # the old design silently gave them no lane at all.
  # ---------------------------------------------------------------------------
  extended:
    name: Extended Validation (Tier 2)
    if: always() && (github.ref_name == 'main' || inputs.full == true || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45

    env:
      CI_RESULTS_DIR: ci-results-extended

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv (pinned — the canonical lock tool)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install via lock (hash-verified requirements.lock)
        run: |
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Initialize results tree
        run: |
          python scripts/ci/make_ci_results.py init "$CI_RESULTS_DIR"
          mkdir -p "$CI_RESULTS_DIR/pytest"

      - name: Run extended suite
        id: ext
        run: |
          set +e
          EXT_FILES=()
          while IFS= read -r line || [[ -n "$line" ]]; do line="${line%%#*}"; line="$(echo "$line" | xargs)"; [[ -n "$line" ]] && EXT_FILES+=("$line"); done < tests/extended_suite.txt
          pytest "${EXT_FILES[@]}" \
                 -n auto --dist loadgroup -q --tb=short \
                 --junitxml="$CI_RESULTS_DIR/pytest/junit.xml" \
                 2>&1 | tee "$CI_RESULTS_DIR/pytest/pytest.txt"
          rc=${PIPESTATUS[0]}
          { echo "EXT_RC=$rc"; } >> "$GITHUB_ENV"
          # NOTE: intentionally NOT make_ci_results.py check ... extended — the
          # quality job's ci_final_gate CHECKS tuple is the shared run-info
          # vocabulary and test_ci_final_gate_fail_closed enforces sync. The
          # gate only runs in `quality`; extended runs in a SEPARATE job on a
          # SEPARATE results dir (ci-results-extended), so it self-verdicts via
          # the EXT_RC fail step below and never enters the quality gate's tree.
          tail -40 "$CI_RESULTS_DIR/pytest/pytest.txt"

      - name: Fail job if extended suite failed
        if: always()
        run: |
          if [ "${EXT_RC:-1}" -ne 0 ]; then
            echo "::error::Tier-2 extended validation failed (rc=$EXT_RC)"
            exit 1
          fi
          echo "EXTENDED PASSED"

      - name: Upload extended results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-extended-${{ github.run_number }}-${{ github.sha }}
          path: ci-results-extended/
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  # ---------------------------------------------------------------------------
  # Heavy testing (integration, E2E, research/backtest, model validation)
  # — does NOT run on every push. Executes only:
  #   * pushes to the dedicated ci-tests branch, or
  #   * manual workflow_dispatch with inputs.full=true
  # Each matrix arm produces its own result artifact; the aggregate job merges
  # them into ONE canonical ci-results artifact for the whole run.
  # ---------------------------------------------------------------------------
  heavy-ci:
    name: Heavy CI (${{ matrix.suite }})
    if: always() && (github.ref_name == 'ci-tests' || inputs.full == true)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e, research-backtest, model-validation]

    env:
      CI_RESULTS_DIR: ci-results

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv (pinned — the canonical lock tool)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install via lock (hash-verified requirements.lock)
        run: |
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Initialize results tree
        run: |
          python scripts/ci/make_ci_results.py init "$CI_RESULTS_DIR" \
            --json "$CI_RESULTS_DIR/run-info/env-digest.json"

      - name: Run suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          case "${{ matrix.suite }}" in
            integration)
              pytest tests/integration/ --ignore=tests/integration/test_playwright_e2e.py \
                --junitxml="$CI_RESULTS_DIR/pytest/junit.xml" --tb=short -q > "$CI_RESULTS_DIR/pytest/pytest.txt" 2>&1
              ;;
            e2e)
              pip install playwright
              python -m playwright install --with-deps chromium
              pytest tests/integration/test_playwright_e2e.py \
                --junitxml="$CI_RESULTS_DIR/pytest/junit.xml" --tb=short -q > "$CI_RESULTS_DIR/pytest/pytest.txt" 2>&1
              ;;
            research-backtest)
              # 2026-09-03 dedup: the 8 files here that are ALSO in
              # tests/critical_suite.txt (research_phase09b, task4_dataset,
              # nse_lifecycle_regression_matrix, lifecycle_verdict_mapping,
              # lifecycle_e2e_v3, hardening_p1_p2, model_benchmark_phase13b,
              # model_generation_phase13) were removed - the quality job
              # already executes them on every push; re-running them in this
              # arm duplicated identical behavior for zero extra signal.
              # 2026-09-14 dedup (heavy-vs-heavy): test_research_api.py lives
              # under tests/integration/ which the integration arm runs whole
              # in the SAME matrix run - re-listing it duplicated execution
              # within one heavy run. Remaining: the 2 non-integration files.
              pytest tests/unit/test_research_registry_null_score_bug075.py \
                    tests/unit/test_research_task4_validation.py \
                --junitxml="$CI_RESULTS_DIR/pytest/junit.xml" --tb=short -q > "$CI_RESULTS_DIR/pytest/pytest.txt" 2>&1
              ;;
            model-validation)
              # 2026-09-03 dedup: 70d_model_validation_task4,
              # model_governance_phase16 and model_lifecycle_phase10 are all
              # members of tests/critical_suite.txt (quality job runs them on
              # every push) - dropped here as duplicate execution.
              # 2026-09-14 dedup: tests/integration/test_model_lifecycle_api.py
              # is covered by the integration arm (same run). Remaining:
              # train_model_cli (unit, not in the manifest).
              pytest tests/unit/test_train_model_cli.py \
                --junitxml="$CI_RESULTS_DIR/pytest/junit.xml" --tb=short -q > "$CI_RESULTS_DIR/pytest/pytest.txt" 2>&1
              ;;
          esac
          rc=$?
          { echo "SUITE_RC=$rc"; } >> "$GITHUB_ENV"
          python scripts/ci/make_ci_results.py check "$CI_RESULTS_DIR" "${{ matrix.suite }}" "$rc" "suite ${{ matrix.suite }}" || true
          exit 0

      - name: Generate suite summary
        continue-on-error: true
        run: |
          set +e
          # Pytest details for the summary
          python - <<'PY' || true
          import json, os
          import xml.etree.ElementTree as ET
          root = os.environ["CI_RESULTS_DIR"]
          junit = os.path.join(root, "pytest", "junit.xml")
          detail = ""
          try:
              tree = ET.parse(junit)
              root = tree.getroot()
              nodes = root.findall("testsuite") if root.tag == "testsuites" else [root]
              tests = failures = skipped = 0
              for node in nodes:
                  tests += int(node.attrib.get("tests", 0) or 0)
                  failures += int(node.attrib.get("failures", 0) or 0) + int(node.attrib.get("errors", 0) or 0)
                  skipped += int(node.attrib.get("skipped", 0) or 0)
              detail = f"{tests} tests, {failures} failed, {skipped} skipped"
          except Exception:
              detail = "no junit.xml produced"
          with open(os.path.join(root, "run-info", "pytest-extra.json"), "w") as fh:
              json.dump({"detail": detail}, fh)
          PY
          python scripts/ci/make_ci_results.py summary "$CI_RESULTS_DIR" || true
          python scripts/ci/make_ci_results.py manifest "$CI_RESULTS_DIR" || true
          python - <<'PY' || true
          import json, os
          root = os.environ["CI_RESULTS_DIR"]
          info_dir = os.path.join(root, "run-info")
          def load(name):
              try:
                  with open(os.path.join(info_dir, name), encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}
          suite = "${{ matrix.suite }}"
          status = load(suite + ".json").get("status", "skipped")
          extra = load("pytest-extra.json")
          lines = [f"## Heavy CI {suite} Results", ""]
          lines.append(f"Status: **{status.upper()}**")
          lines.append(extra.get("detail", "Tests: n/a"))
          lines.append("")
          lines.append(f"Artifact: `ci-results-{suite}-{os.environ.get('GITHUB_RUN_NUMBER', '?')}-{os.environ.get('GITHUB_SHA', '?')}` (30-day retention)")
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          PY
          exit 0

      - name: Upload suite artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-${{ matrix.suite }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

      - name: Fail job if suite failed
        if: always()
        run: |
          python - <<'PY'
          import json, os
          root = os.environ["CI_RESULTS_DIR"]
          suite = "${{ matrix.suite }}"
          p = os.path.join(root, "run-info", suite + ".json")
          try:
              with open(p, encoding="utf-8") as fh:
                  status = json.load(fh).get("status", "skipped")
          except Exception:
              status = "errored"
          print(f"suite={suite} status={status}")
          if status in ("failed", "errored"):
              raise SystemExit(1)
          print("SUITE PASSED")
          PY

  # ---------------------------------------------------------------------------
  # Aggregation — merge per-arm results into ONE canonical artifact for the
  # whole run. Runs only when heavy-ci ran (ci-tests or dispatch full=true).
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate CI Results
    if: always() && (github.ref_name == 'ci-tests' || inputs.full == true)
    needs: heavy-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all suite artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          # merge-multiple is intentionally OFF: each arm's ci-results/ tree
          # must stay separate so per-arm run-info files (metadata/summary/
          # manifest) never overwrite each other during aggregation.

      - name: Prepare canonical result structure
        run: |
          rm -rf ci-results
          mkdir -p ci-results/run-info ci-results/heavy
          suffix="-${{ github.run_number }}-${{ github.sha }}"
          # download-artifact with merge-multiple OFF extracts each artifact's
          # CONTENTS directly into artifacts/<artifact-name>/ (no ci-results/
          # wrapper). Each arm's tree therefore lives at the artifact dir root.
          for d in artifacts/ci-results-*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            suite="${name%$suffix}"
            suite="${suite#ci-results-}"
            case "$suite" in quality*) dest="ci-results" ;; *) dest="ci-results/heavy/$suite" ;; esac
            mkdir -p "$dest"
            cp -r "$d"* "$dest"/ 2>/dev/null || true
            echo "merged arm: $suite"
          done
          find ci-results -type f | sort

      - name: Regenerate merged summary + manifest
        run: |
          # Re-run the pipeline over the merged tree so summary.md/manifest.json/
          # SHA256SUMS.txt reflect the WHOLE run (all suites), not the last arm.
          python scripts/ci/make_ci_results.py summary ci-results || true
          python scripts/ci/make_ci_results.py manifest ci-results || true
          find ci-results/run-info -type f | sort

      - name: Upload canonical aggregate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-${{ github.workflow }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-results/
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

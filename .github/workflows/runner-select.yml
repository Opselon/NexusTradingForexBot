name: runner-select

# ---------------------------------------------------------------------------
# CENTRALIZED RUNNER ROUTING — the one place a runner class is chosen.
# Called as a REUSABLE WORKFLOW by every lane that needs a runner:
#
#   - uses: ./.github/workflows/runner-select.yml
#     with:
#       platform: linux            # linux | windows | macos
#       untrusted: ${{ ... }}      # true for fork PRs (never self-hosted)
#
# It runs the preflight on a GitHub-hosted micro-VM (the task requires the
# availability check itself to run on GitHub-hosted infrastructure), emits a
# JSON decision, and the caller routes with two mutually-exclusive jobs.
#
# Why a reusable workflow and not a composite action: the decision must be
# computed BEFORE any real job is scheduled, must be visible as its own
# check-run for observability, and must run on GitHub-hosted hardware even
# when the work itself is routed to a self-hosted machine. A composite action
# would execute ON the target runner — self-hosted — defeating the point.
#
# Funding model: this preflight costs ~5-8s of ubuntu-latest per invocation.
# It is NOT run per-job; lanes needing a runner call this once and fan out.
# ---------------------------------------------------------------------------

# NOTE: ``on:`` is quoted everywhere below. YAML 1.1 parses the bare token
# ``on`` as the boolean True, which would silently swallow sibling keys
# (``outputs:`` in particular) into the trigger mapping and make them
# unreachable to callers.
"on":
  workflow_call:
    inputs:
      platform:
        description: "Target platform: linux | windows | macos"
        type: string
        required: true
      untrusted:
        description: "Force the GitHub-hosted class (fork PRs, no secrets exposed)"
        type: boolean
        default: false

# Workflow-level outputs: the ONLY place a caller can read these. They are
# deliberately NOT nested under workflow_call (a common mistake that makes
# the outputs unreachable to callers).
outputs:
  runner_class:
    description: "self-hosted | github-hosted"
    value: ${{ jobs.select.outputs.runner_class }}
  self_hosted_eligible:
    description: "Whether an online+idle matching self-hosted runner exists"
    value: ${{ jobs.select.outputs.self_hosted_eligible }}
  selection_reason:
    description: "Human-readable, secret-free reason for the decision"
    value: ${{ jobs.select.outputs.selection_reason }}
  decision_json:
    description: "Full JSON decision record (logs + summaries)"
    value: ${{ jobs.select.outputs.decision_json }}

permissions:
  contents: read

# IMPORTANT: the preflight must never inherit repo secrets. The runner-status
# credential is injected ONLY as the ambient env of this workflow, and the
# selector script is the sole consumer. Fork PRs never see it (untrusted=1
# makes the credential irrelevant — the answer is pre-determined).
env:
  NSE_RUNNER_STATUS_TOKEN: ${{ secrets.NSE_RUNNER_STATUS_TOKEN }}

jobs:
  select:
    name: Runner Selector (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runner_class: ${{ steps.emit.outputs.runner_class }}
      self_hosted_eligible: ${{ steps.emit.outputs.self_hosted_eligible }}
      selection_reason: ${{ steps.emit.outputs.selection_reason }}
      decision_json: ${{ steps.emit.outputs.decision_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select runner class (availability preflight)
        id: emit
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.platform }}" in
            linux)   LABELS="self-hosted,Linux,X64";   HOSTED="ubuntu-latest" ;;
            windows) LABELS="self-hosted,Windows,X64"; HOSTED="windows-latest" ;;
            macos)   LABELS="self-hosted,macOS,ARM64"; HOSTED="macos-latest" ;;
            *) echo "::error::unknown platform '${{ inputs.platform }}'"; exit 1 ;;
          esac
          UNTRUSTED=""
          if [ "${{ inputs.untrusted }}" = "true" ]; then UNTRUSTED="--untrusted"; fi
          DECISION=$(python3 scripts/ci/runner_select.py \
            --platform "${{ inputs.platform }}" \
            --labels "$LABELS" \
            --hosted "$HOSTED" \
            $UNTRUSTED)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          # Inline the decision for the outputs (fromJson below).
          echo "decision_json=$DECISION" >> "$GITHUB_OUTPUT"
          echo "runner_class=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["runner_class"])' <<<"$DECISION")" >> "$GITHUB_OUTPUT"
          echo "self_hosted_eligible=$(python3 -c 'import json,sys;print(str(json.load(sys.stdin)["self_hosted_eligible"]).lower())' <<<"$DECISION")" >> "$GITHUB_OUTPUT"
          echo "selection_reason=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["reason"])' <<<"$DECISION")" >> "$GITHUB_OUTPUT"
        env:
          # Credential presence is the ONLY secret-dependent part. Absent =>
          # fail open to hosted. Never printed, never forwarded.
          NSE_RUNNER_STATUS_TOKEN: ${{ env.NSE_RUNNER_STATUS_TOKEN }}

      - name: Observability record
        if: always()
        shell: bash
        run: |
          {
            echo "## Runner selection (${{ inputs.platform }})"
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| platform | \`${{ inputs.platform }}\` |"
            echo "| requested labels | \`$(python3 -c 'import json,sys;print(",".join(json.load(sys.stdin)["labels"]))' <<<"${{ steps.emit.outputs.decision_json }}")\` |"
            echo "| self-hosted enabled | \`${{ steps.emit.outputs.self_hosted_eligible != 'false' && 'checked' || 'n/a' }}\` |"
            echo "| runner class | \`${{ steps.emit.outputs.runner_class }}\` |"
            echo "| reason | ${{ steps.emit.outputs.selection_reason }} |"
            echo "| untrusted (fork) PR | \`${{ inputs.untrusted }}\` |"
            echo ''
            echo 'Availability checks are not atomic reservations; a self-hosted'
            echo 'job can still be queued when the runner is taken between the'
            echo 'check and the assignment (see docs/CI_ARCHITECTURE.md).'
          } >> "$GITHUB_STEP_SUMMARY"

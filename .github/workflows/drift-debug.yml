name: Drift Debug (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv 0.12.10
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v5.4.2
        with:
          enable-cache: false
          version: "0.12.10"

      - name: Resolver environment
        run: |
          uv --version
          uv python list --only-installed || true
          python3 --version

      - name: Fresh universal resolve (CI-identical)
        run: |
          set -e
          uv pip compile pyproject.toml --all-extras --universal --generate-hashes \
            --no-header --output-file /tmp/fresh.lock
          echo "=== numpy arms in CI fresh lock ==="
          grep -n "^numpy==" /tmp/fresh.lock || true
          echo "=== polars arms in CI fresh lock ==="
          grep -n "^polars==" /tmp/fresh.lock || true
          echo "=== diff vs committed lock (first 80 lines) ==="
          diff <(grep -v "^#" requirements.lock) <(grep -v "^#" /tmp/fresh.lock) | head -80 || true
          echo "=== uv-resolved python notes ==="
          grep -m 5 -i "resolved\|python" /tmp/fresh.lock || true

      - name: Upload fresh lock
        if: always()
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-fresh-lock
          path: /tmp/fresh.lock

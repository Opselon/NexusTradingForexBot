name: One-shot dependency lock regeneration

on:
  push:
    branches:
      - bug/fix-ci-final-summary-delivery

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[lock-regen]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Regenerate generated dependency artifacts
        run: |
          set -euo pipefail
          python scripts/ci/check_dependency_drift.py --regen
          python scripts/ci/check_dependency_drift.py
      - name: Commit and push regenerated artifacts
        env:
          BRANCH: bug/fix-ci-final-summary-delivery
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements.lock requirements.txt; then
            echo "No dependency artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements.txt
          git commit -m "chore(deps): regenerate lock artifacts [lock-regen]"
          git push origin "HEAD:$BRANCH"

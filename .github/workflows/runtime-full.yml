name: Full Runtime Certification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: full-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  RUNTIME_SOAK_SECONDS: "120"
  RUNTIME_SOAK_PORT: "18080"

jobs:
  runtime-model-fixture:
    name: Runtime Model Fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install full runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,web,postgres]"

      - name: Provision and certify runtime model bundle
        run: |
          set -o pipefail
          python scripts/ci/runtime_gate.py --json --evidence | tee runtime-gate.json

      - name: Verify complete runtime bundle
        run: |
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.pt
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/manifest.json
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.scaler.npz
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.meta.json

      - name: Upload runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-runtime-model-${{ github.run_id }}
          path: |
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.pt
            artifacts/models/scalp/XAUUSD/70d_liquidity/manifest.json
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.scaler.npz
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.meta.json
            runtime-gate.json
            artifacts/forensics/runtime_gate_result.json
          if-no-files-found: error
          retention-days: 14

  full-runtime-provider:
    name: Full NSE Runtime (${{ matrix.provider }})
    needs: runtime-model-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgres]

    env:
      NSE_PG_TEST_PASSWORD: nse_password_dev
      NSE_DATABASE__PG_HOST: 127.0.0.1
      NSE_DATABASE__PG_PORT: "5432"
      NSE_DATABASE__PG_DATABASE: nse_audit
      NSE_DATABASE__PG_USER: nse_user

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install full runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,web,postgres]"

      - name: Download certified runtime bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-runtime-model-${{ github.run_id }}
          path: .

      - name: Prepare isolated runtime environment
        run: |
          root="$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"
          mkdir -p "$root"
          echo "NEXUS_SETTINGS_DB=$root/app_settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$root/audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$root/data" >> "$GITHUB_ENV"
          echo "NSE_RUNTIME_SOAK_PORT=${{ env.RUNTIME_SOAK_PORT }}" >> "$GITHUB_ENV"
          echo "NSE_EXECUTION__MODE=PAPER" >> "$GITHUB_ENV"
          echo "NSE_EXECUTION__SYMBOL=XAUUSD" >> "$GITHUB_ENV"
          echo "NSE_NO_BROWSER=1" >> "$GITHUB_ENV"
          echo "NSE_NO_TELEGRAM=1" >> "$GITHUB_ENV"
          echo "NSE_NEWS__ENABLED=false" >> "$GITHUB_ENV"
          echo "NSE_TELEGRAM__ENABLED=false" >> "$GITHUB_ENV"
          echo "NSE_NO_AUTO_INSTALL=1" >> "$GITHUB_ENV"
          echo "NSE_WEB_AUTH_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          if [ "${{ matrix.provider }}" = "postgres" ]; then
            echo "NSE_DATABASE__PROVIDER=postgresql" >> "$GITHUB_ENV"
          else
            echo "NSE_DATABASE__PROVIDER=sqlite" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.provider }}" = "sqlite" ]; then
            echo "NSE_DATABASE__SQLITE_PATH=$root/audit.sqlite" >> "$GITHUB_ENV"
          fi

      - name: Start disposable PostgreSQL
        if: matrix.provider == 'postgres'
        run: |
          set -euo pipefail
          docker rm -f nse-ci-pg >/dev/null 2>&1 || true
          docker run -d --name nse-ci-pg             -e POSTGRES_DB=nse_audit             -e POSTGRES_USER=nse_user             -e POSTGRES_PASSWORD="$NSE_PG_TEST_PASSWORD"             -p 5432:5432             postgres:16-alpine
          for i in $(seq 1 40); do
            if docker exec nse-ci-pg pg_isready -U nse_user -d nse_audit >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nse-ci-pg | tail -100 || true
          exit 1

      - name: Run full real-process 120-second soak
        run: |
          set -o pipefail
          python scripts/ci/provider_runtime_soak.py             --provider "${{ matrix.provider }}"             --duration "${{ env.RUNTIME_SOAK_SECONDS }}"             --port "${{ env.RUNTIME_SOAK_PORT }}"             --evidence-dir "$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"

      - name: Print full runtime diagnostics
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "nse-full-runtime-${{ matrix.provider }}"
          report = {}
          query = {}
          for name, target in (
              ("report", root / "full_runtime_report.json"),
              ("query", root / "query_matrix.json"),
          ):
              try:
                  data = json.loads(target.read_text(encoding="utf-8"))
                  if name == "report":
                      report = data
                  else:
                      query = data
              except Exception as exc:
                  print(f"{name} report unavailable: {exc}")

          diag = report.get("diagnostics", {})
          print("=== FULL RUNTIME VERDICT ===")
          print("STATUS:", report.get("status", "FAIL"))
          print("DURATION:", report.get("elapsed_sec"))
          print("PROCESS_RC:", report.get("process_exit_code"))
          print("QUERIES:", f"{query.get('queries_ok', 0)}/{query.get('queries_total', 0)}")
          print("QUERY_FAILURES:", query.get("queries_failed", 0))
          print("QUERY_FLOOR:", query.get("minimum_query_floor"))
          print("QUERY_FLOOR_MET:", query.get("query_floor_met"))
          print("WARNINGS:", diag.get("warning_count", 0))
          print("ERRORS:", diag.get("error_count", 0))
          print("TRACEBACKS:", diag.get("traceback_count", 0))

          if report.get("runtime_error"):
              print("RUNTIME_ERROR:", report["runtime_error"])

          print("=== WARNINGS ===")
          for item in diag.get("warnings", [])[:50]:
              print(f"[WARN] line={item['line']} {item['message']}")

          print("=== ERRORS ===")
          for item in diag.get("errors", [])[:50]:
              print(f"[ERROR] line={item['line']} {item['message']}")

          print("=== TRACEBACK SOURCE FRAMES ===")
          for trace in diag.get("tracebacks", [])[:25]:
              frames = " -> ".join(
                  f"{frame['file']}:{frame['line']}"
                  + (f"::{frame['function']}" if frame.get("function") else "")
                  for frame in trace.get("frames", [])
              )
              print(
                  f"[TRACE] lines={trace.get('start_line')}-{trace.get('end_line')} "
                  f"{frames or 'no parsed frames'}"
              )
          PY

      - name: Upload full runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-full-runtime-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/full_runtime_report.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/query_matrix.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/runtime.log
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup PostgreSQL
        if: always() && matrix.provider == 'postgres'
        run: docker rm -f nse-ci-pg >/dev/null 2>&1 || true

  mt5-wine-runtime:
    name: MetaTrader 5 Wine Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NEXUS_MT5_ROOT: ${{ runner.temp }}/nexus-mt5
      NEXUS_MT5_DISPLAY: "99"
      NEXUS_MT5_WINEDEBUG: "-all"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wine + Xvfb
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine winbind xvfb x11-utils

      - name: Start Xvfb
        run: |
          Xvfb ":$NEXUS_MT5_DISPLAY" -screen 0 1280x1024x24             > "$RUNNER_TEMP/nexus-mt5-xvfb.log" 2>&1 &
          echo "DISPLAY=:$NEXUS_MT5_DISPLAY" >> "$GITHUB_ENV"

      - name: Verify Wine
        run: |
          wine --version
          wineserver --version || true

      - name: Install official MetaTrader 5
        run: |
          export NEXUS_MT5_WINE="$(command -v wine)"
          export NEXUS_MT5_WINESERVER="$(command -v wineserver)"
          bash scripts/linux/mt5_runtime.sh install

      - name: Start MT5 and soak 120 seconds
        run: |
          set -euo pipefail
          export NEXUS_MT5_WINE="$(command -v wine)"
          export NEXUS_MT5_WINESERVER="$(command -v wineserver)"
          trap 'bash scripts/linux/mt5_runtime.sh stop || true' EXIT

          bash scripts/linux/mt5_runtime.sh start
          python scripts/linux/mt5_doctor.py
          bash scripts/linux/mt5_runtime.sh health
          for i in $(seq 1 24); do
            sleep 5
            bash scripts/linux/mt5_runtime.sh health
          done
          python scripts/linux/mt5_doctor.py
          bash scripts/linux/mt5_runtime.sh logs > "$RUNNER_TEMP/nexus-mt5-runtime.log" 2>&1 || true
          bash scripts/linux/mt5_runtime.sh stop
          trap - EXIT

      - name: Trace MT5 warnings and errors
        if: always()
        continue-on-error: true
        run: |
          log="$RUNNER_TEMP/nexus-mt5-runtime.log"
          if [ -f "$log" ]; then
            echo "=== MT5/WINE WARNINGS+ERRORS ==="
            grep -Ein 'warn|error|critical|exception|fatal' "$log" | head -100 || true
          else
            echo "MT5 runtime log not present"
          fi

      - name: Upload MT5/Wine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-mt5-wine-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nexus-mt5/
            ${{ runner.temp }}/nexus-mt5-xvfb.log
            ${{ runner.temp }}/nexus-mt5-runtime.log
          if-no-files-found: warn
          retention-days: 14

  full-runtime-verdict:
    name: Full Runtime Overall Verdict
    if: always()
    needs:
      - full-runtime-provider
      - mt5-wine-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Aggregate required runtime lanes
        run: |
          echo "SQLite/PostgreSQL matrix: ${{ needs.full-runtime-provider.result }}"
          echo "MT5/Wine line:             ${{ needs.mt5-wine-runtime.result }}"
          if [ "${{ needs.full-runtime-provider.result }}" != "success" ]; then
            echo "::error::Full SQLite/PostgreSQL runtime matrix failed"
            exit 1
          fi
          if [ "${{ needs.mt5-wine-runtime.result }}" != "success" ]; then
            echo "::error::MT5/Wine runtime line failed"
            exit 1
          fi
          echo "FULL RUNTIME CERTIFICATION: PASS"

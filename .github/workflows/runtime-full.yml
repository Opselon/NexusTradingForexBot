name: Full Runtime Certification

on:
  push:
    branches: [main, develop, ci-tests]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: full-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  RUNTIME_SOAK_SECONDS: "120"

jobs:
  runtime-model-fixture:
    name: Runtime Model Fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,web,postgres]"

      - name: Build and certify disposable runtime model
        run: |
          set -o pipefail
          python scripts/ci/runtime_gate.py --json --evidence | tee runtime-gate.json

      - name: Verify complete runtime bundle
        run: |
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.pt
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/manifest.json
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.scaler.npz
          test -s artifacts/models/scalp/XAUUSD/70d_liquidity/model.meta.json

      - name: Upload certified runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: full-runtime-model-${{ github.run_id }}
          path: |
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.pt
            artifacts/models/scalp/XAUUSD/70d_liquidity/manifest.json
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.scaler.npz
            artifacts/models/scalp/XAUUSD/70d_liquidity/model.meta.json
            runtime-gate.json
            artifacts/forensics/runtime_gate_result.json
          if-no-files-found: error
          retention-days: 7

  runtime-provider-soak:
    name: Full NSE Runtime (${{ matrix.provider }})
    needs: runtime-model-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        provider:
          - sqlite
          - postgres

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nse_audit
          POSTGRES_USER: nse_user
          POSTGRES_PASSWORD: nse_password_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nse_user -d nse_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NSE_PG_TEST_PASSWORD: nse_password_dev
      NSE_DATABASE__PG_HOST: 127.0.0.1
      NSE_DATABASE__PG_PORT: 5432
      NSE_DATABASE__PG_DATABASE: nse_audit
      NSE_DATABASE__PG_USER: nse_user
      NSE_RUNTIME_SOAK_PORT: 18080

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install full runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,web,postgres]"

      - name: Download certified runtime bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-runtime-model-${{ github.run_id }}
          path: .

      - name: Prepare isolated provider environment
        run: |
          root="$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"
          mkdir -p "$root"
          echo "NEXUS_SETTINGS_DB=$root/app_settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$root/audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$root/data" >> "$GITHUB_ENV"
          if [ "${{ matrix.provider }}" = "postgres" ]; then
            echo "NSE_DATABASE__PROVIDER=postgresql" >> "$GITHUB_ENV"
          else
            echo "NSE_DATABASE__PROVIDER=sqlite" >> "$GITHUB_ENV"
          fi
          echo "NSE_EXECUTION__MODE=PAPER" >> "$GITHUB_ENV"
          echo "NSE_EXECUTION__SYMBOL=XAUUSD" >> "$GITHUB_ENV"
          echo "NSE_NO_BROWSER=1" >> "$GITHUB_ENV"
          echo "NSE_NO_TELEGRAM=1" >> "$GITHUB_ENV"
          echo "NSE_NEWS__ENABLED=false" >> "$GITHUB_ENV"
          echo "NSE_TELEGRAM__ENABLED=false" >> "$GITHUB_ENV"
          echo "NSE_NO_AUTO_INSTALL=1" >> "$GITHUB_ENV"

      - name: Verify PostgreSQL service
        if: matrix.provider == 'postgres'
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U nse_user -d nse_audit; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL service did not become ready"
          exit 1

      - name: Boot FULL NSE process and soak for 120 seconds
        run: |
          python scripts/ci/provider_runtime_soak.py             --provider "${{ matrix.provider }}"             --duration "${{ env.RUNTIME_SOAK_SECONDS }}"             --port "$NSE_RUNTIME_SOAK_PORT"             --evidence-dir "$RUNNER_TEMP/nse-full-runtime-${{ matrix.provider }}"

      - name: Publish runtime warnings/errors/traces to job summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "nse-full-runtime-${{ matrix.provider }}"
          report_path = root / "full_runtime_report.json"
          query_path = root / "query_matrix.json"

          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except Exception as exc:
              report = {"status": "FAIL", "runtime_error": f"missing report: {exc}"}

          try:
              query = json.loads(query_path.read_text(encoding="utf-8"))
          except Exception:
              query = {}

          diag = report.get("diagnostics", {})
          lines = [
              "## Full NSE Runtime — ${{ matrix.provider }}",
              "",
              f"**Verdict:** `{report.get('status', 'FAIL')}`",
              f"**Soak duration:** {report.get('elapsed_sec', 'n/a')}s",
              f"**Process exit:** {report.get('process_exit_code', 'n/a')}",
              f"**DB queries:** {query.get('queries_ok', 0)}/{query.get('queries_total', 0)} successful",
              f"**Query failures:** {query.get('queries_failed', 0)}",
              f"**Warnings:** {diag.get('warning_count', 0)}",
              f"**Errors:** {diag.get('error_count', 0)}",
              f"**Tracebacks:** {diag.get('traceback_count', 0)}",
              "",
          ]

          if report.get("runtime_error"):
              lines += ["### Runtime failure", "", str(report["runtime_error"]), ""]

          errors = diag.get("errors", [])
          if errors:
              lines += ["### Runtime errors", ""]
              lines += [f"- line {e['line']}: {e['message']}" for e in errors[:25]]
              lines += [""]

          warnings = diag.get("warnings", [])
          if warnings:
              lines += ["### Runtime warnings", ""]
              lines += [f"- line {w['line']}: {w['message']}" for w in warnings[:25]]
              lines += [""]

          traces = diag.get("tracebacks", [])
          if traces:
              lines += ["### Traceback source frames", ""]
              for trace in traces[:10]:
                  frames = ", ".join(
                      f"{frame['file']}:{frame['line']}" +
                      (f" ({frame['function']})" if frame.get("function") else "")
                      for frame in trace.get("frames", [])
                  )
                  lines.append(
                      f"- lines {trace.get('start_line')}-{trace.get('end_line')}: "
                      f"{frames or 'no parsed frames'}"
                  )

          summary = "\n".join(lines)
          print(summary)
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(summary + "\n")
          PY

      - name: Upload FULL runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: full-runtime-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/full_runtime_report.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/query_matrix.json
            ${{ runner.temp }}/nse-full-runtime-${{ matrix.provider }}/runtime.log
          if-no-files-found: error
          retention-days: 14

  mt5-wine-soak:
    name: MetaTrader 5 Wine Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NEXUS_MT5_ROOT: ${{ runner.temp }}/nexus-mt5
      NEXUS_MT5_DISPLAY: "99"
      NEXUS_MT5_WINEDEBUG: "-all"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wine + Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine winbind xvfb x11-utils

      - name: Start headless display
        run: |
          Xvfb ":$NEXUS_MT5_DISPLAY" -screen 0 1280x1024x24             > "$RUNNER_TEMP/nexus-mt5-xvfb.log" 2>&1 &
          echo "DISPLAY=:$NEXUS_MT5_DISPLAY" >> "$GITHUB_ENV"

      - name: Verify Wine runtime
        run: |
          export NEXUS_MT5_WINE="$(command -v wine)"
          export NEXUS_MT5_WINESERVER="$(command -v wineserver)"
          "$NEXUS_MT5_WINE" --version
          "$NEXUS_MT5_WINESERVER" --version || true

      - name: Install official MetaTrader 5 terminal
        run: |
          export NEXUS_MT5_WINE="$(command -v wine)"
          export NEXUS_MT5_WINESERVER="$(command -v wineserver)"
          bash scripts/linux/mt5_runtime.sh install

      - name: Run 120-second MT5 health soak with log evidence
        run: |
          set -euo pipefail
          export NEXUS_MT5_WINE="$(command -v wine)"
          export NEXUS_MT5_WINESERVER="$(command -v wineserver)"
          trap 'bash scripts/linux/mt5_runtime.sh stop || true' EXIT

          bash scripts/linux/mt5_runtime.sh start
          python scripts/linux/mt5_doctor.py
          bash scripts/linux/mt5_runtime.sh health

          for i in $(seq 1 24); do
            sleep 5
            bash scripts/linux/mt5_runtime.sh health
          done

          python scripts/linux/mt5_doctor.py
          bash scripts/linux/mt5_runtime.sh logs || true
          bash scripts/linux/mt5_runtime.sh stop
          trap - EXIT

      - name: Upload MT5/Wine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: mt5-wine-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nexus-mt5/
            ${{ runner.temp }}/nexus-mt5-xvfb.log
          if-no-files-found: warn
          retention-days: 14

  runtime-overall:
    name: Full Runtime Matrix Verdict
    if: always()
    needs:
      - runtime-provider-soak
      - mt5-wine-soak
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Fail if any full runtime lane failed
        run: |
          echo "provider matrix: ${{ needs.runtime-provider-soak.result }}"
          echo "MT5/Wine:       ${{ needs.mt5-wine-soak.result }}"
          if [ "${{ needs.runtime-provider-soak.result }}" != "success" ]; then
            echo "::error::SQLite/PostgreSQL full runtime matrix did not pass"
            exit 1
          fi
          if [ "${{ needs.mt5-wine-soak.result }}" != "success" ]; then
            echo "::error::MT5/Wine runtime lane did not pass"
            exit 1
          fi
          echo "FULL RUNTIME CERTIFICATION PASSED"

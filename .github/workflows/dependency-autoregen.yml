name: Dependency Lock Self-Heal

# GENERATED-ARTIFACT KEEPER -----------------------------------------------------
# pyproject.toml is the single source of truth; requirements.lock and
# requirements.txt are GENERATED from it by
# `python scripts/ci/check_dependency_drift.py --regen` (uv 0.12.10).
#
# The problem this workflow solves: Dependabot bumps the *ranges* in
# pyproject.toml but cannot run `uv pip compile`, so it opens PRs that carry a
# stale lock. The "Dependency drift (lock vs pyproject)" gate then fails on
# every dependency PR and blocks the merge queue (seen on #633-#637).
#
# Fix in two directions:
#   1. push -> main/develop : after ANY pyproject.toml change lands, regenerate
#      the artifacts and commit them straight to the branch so main can never
#      stay drifted. This is what unblocks every PR that does not itself touch
#      pyproject.toml (all npm/frontend and github-actions PRs): their check
#      compares the committed lock against a fresh compile, and a fresh compile
#      only ever depends on pyproject.toml.
#   2. pull_request        : if the PR head itself moved pyproject.toml, push
#      the regenerated artifacts onto the PR branch so the branch is always
#      internally consistent.
#
# Idempotent: when the artifacts already match, `--regen` rewrites the same
# bytes, `git diff --quiet` is true and nothing is committed — so this workflow
# converges after at most one extra commit and never loops.
#
# The commit carries [skip ci]: pushing with GITHUB_TOKEN does not emit new
# workflow events anyway, and the drift gate has already proven consistency in
# this run.

on:
  push:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-lock.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lock-selfheal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate lockfiles when drifted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For pull_request events this is the PR head; we commit back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11 (lowest supported — the resolver needs it)
        # Universal resolution PRUNES marker arms below the lowest interpreter
        # uv can see (see dependency-lock.yml for the full rationale). Without
        # this pin the fresh lock silently drops the <3.12 arms and drifts.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        # PIN must match dependency-lock.yml exactly, otherwise the two
        # workflows would disagree about what "in sync" means.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.10"

      - name: Regenerate requirements.lock + requirements.txt
        run: python scripts/ci/check_dependency_drift.py --regen

      - name: Re-verify consistency (check mode, must now pass)
        run: python scripts/ci/check_dependency_drift.py

      - name: Commit regenerated artifacts if they changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- requirements.lock requirements.txt; then
            echo "::notice::Lockfiles already consistent with pyproject.toml — nothing to commit."
            exit 0
          fi
          git add requirements.lock requirements.txt
          git commit -m "chore(deps): regenerate requirements.lock + requirements.txt [skip ci]

          Generated by the Dependency Lock Self-Heal workflow. pyproject.toml
          moved (dependency update) so the compiled artifacts had to be
          re-resolved with uv 0.12.10. Both files are generated — never hand
          edit; rerun scripts/ci/check_dependency_drift.py --regen instead.
          See docs/architecture/DEPENDENCY_MANAGEMENT.md."
          git push
          echo "::notice::Committed regenerated lockfiles."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do NOT emit workflow events, so the PR's required
      # gates would otherwise stay reported against the pre-regen commit and
      # the merge box would stay blocked ("stale checks"). Re-request the check
      # suites directly so they re-run against the new head.
      - name: Re-request PR checks against the new head
        if: github.event_name == 'pull_request' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # Discover check suites attached to the PR's head ref and ask GitHub
          # to re-run them. check_suites/rerequest requires checks:write, which
          # the permissions block above grants.
          suites=$(gh api "repos/${owner}/${repo}/commits/${head_sha}/check-suites" --jq '.check_suites[].id')
          for suite_id in $suites; do
            echo "re-requesting check suite $suite_id"
            gh api -X POST "repos/${owner}/${repo}/check-suites/${suite_id}/rerequest" || true
          done
          echo "::notice::Re-requested check suites for ${head_sha}."

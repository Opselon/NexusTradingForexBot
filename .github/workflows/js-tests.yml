name: JS Tests

# Frontend gate — BOTH console habitats:
#   * legacy Web/ vanilla-JS dashboard: syntax gate + tests/js/*.test.js
#     (node, tiny window/document shim)
#   * React Control Center (frontend/): npm ci + tsc -b + vite build +
#     scripts/build/validate_frontend_dist.py — the production bundle this
#     workflow's build validates is the artifact the release EXE ships
#     (EUR-WAVE contract #11), so a broken build/asset set blocks merge.
# ci.yml covers Python (ruff/mypy/pytest).

on:
  push:
    branches: [main, ci-tests]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One JS run per ref; a new push supersedes the old.
concurrency:
  group: js-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Diff/poll pattern from the requested set uses read-only contents.
permissions:
  contents: read

env:
  # Advisory-only Telegram wiring (never printed, never fails CI).
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: ${{ secrets.USER_ID }}

jobs:
  js-tests:
    name: Frontend JS Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # EUR-WAVE (contract #11): production React Control Center must build
      # and validate on every PR — this bundle is what the release EXE ships,
      # so broken typecheck/build/asset set is a merge blocker, same as Web JS.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck + production build
        working-directory: frontend
        run: |
          npx tsc -b
          npx vite build
      - name: Validate production bundle (assets/manifest/icons/offline)
        run: python3 scripts/build/validate_frontend_dist.py frontend/dist

      # Syntax gate: every shipped Web/*.js must parse cleanly. The patch/CRLF
      # trap (BUG-068 family) corrupts JS silently — catch it before tests.
      - name: Syntax gate (node --check on all Web JS)
        run: |
          fail=0
          for f in Web/app.js Web/api_client.js Web/forensic_console.js; do
            if [ -f "$f" ]; then
              echo "checking $f"
              node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
            fi
          done
          exit $fail

      # Pure-logic unit tests (tests/js/*.test.js). They load Web/*.js with a
      # window/document shim and assert exported derivation/normalization logic.
      - name: Run JS unit tests
        run: |
          shopt -s nullglob
          files=(tests/js/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests found; skipping."
            exit 0
          fi
          fail=0
          for t in "${files[@]}"; do
            echo "==> $t"
            node "$t" || fail=1
          done
          exit $fail

      # Advisory Telegram note (never fails CI).
      - name: Telegram - JS tests finished
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results ci-results js-finished || true

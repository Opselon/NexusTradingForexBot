name: Tests (OS Matrix)

# ---------------------------------------------------------------------------
# Multi-OS Python gate — CI runner-routing architecture (2026-11).
#
# ROUTING (centralized; see .github/workflows/runner-select.yml and
# scripts/ci/runner_select.py):
#
#   * LINUX no longer runs on PR/push at all (2026-11-10 centralization:
#     Quality owns ALL PR/push test execution — one execution per PR).
#     It routes SELF-HOSTED FIRST through a TWO-TIER self-hosted pool,
#     with an ubuntu-latest last resort when no tier has an online+idle
#     runner, or the request comes from an untrusted fork PR. Fork PRs
#     NEVER execute on the persistent self-hosted machines. The Linux leg
#     runs only the semi-monthly FULL-suite health sweep (schedule) and
#     manual dispatch (full-platform check).
#       tier-1: self-hosted,Linux,X64,opselon-vm   (8-thread Docker runner — preferred)
#       tier-2: self-hosted,Linux,X64,nexus-2core  (secondary 2-core box)
#   * WINDOWS is no longer scheduled on ordinary PR/push events. The full
#     Windows test coverage moved to .github/workflows/tests-windows.yml
#     (workflow_dispatch, ENABLE_WINDOWS_SELF_HOSTED feature flag). The
#     required branch-protection context "Py Tests (windows-latest)" is
#     still emitted here, as an explicit "NOT EXECUTED" status — NOT a
#     test verdict.
#   * macOS is likewise manual-only (tests-macos.yml, dispatch). The
#     required context "Py Tests (macos-latest)" is emitted the same way.
#
# REQUIRED-CONTEXT HONESTY CONTRACT. GitHub treats a job skipped by a
# conditional as "Success" (docs: "Handling skipped but required checks"),
# so a skipped job CAN satisfy a required context. This repo is stricter:
# a skipped test is never reported as passed. The Windows/macOS legs below
# emit a visible "NOT EXECUTED — manual workflow only" status instead of a
# test verdict, and the release authorization
# (scripts/release/release_auth_gate.py) now requires the REAL Windows lane
# evidence for the release SHA instead of this context.
#
# BEFORE (measured 2026-11-06, main push):
#   windows-latest FULL 1086s + macOS SKIP-REPORT 22s on EVERY main push.
# AFTER (2026-11-10): this workflow does not run on PR/push at all.
#   Quality owns PR/push execution; this matrix runs the FULL suite on
#   the semi-monthly schedule + manual dispatch only. Windows/macOS run
#   on demand.
# ---------------------------------------------------------------------------

on:
  # CENTRALIZATION (2026-11-10, user directive): no push/pull_request
  # triggers. Quality (ci.yml) owns ALL PR/push test execution — one
  # execution per PR. This matrix ran its Linux leg on every PR: it
  # installed a full workspace venv BEFORE the decide step, then
  # SKIP-REPORTed — racing Quality for the single online runner and
  # falling back to hosted. The matrix now runs only the semi-monthly
  # FULL-suite health sweep + manual dispatch (full-platform check).
  schedule:
    # CI quota diet (2026-11): was weekly (Monday 07:17). Now SEMI-MONTHLY —
    # the only automatic FULL-suite health sweep (1st & 15th, 07:17 UTC).
    - cron: "17 7 1,15 * *"
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Force the FULL critical suite on the Linux leg (skip PR fast shapes)"
        type: boolean
        default: false

concurrency:
  group: tests-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # PyPI as a FALLBACK index (2026-11-09): the self-hosted tiers' effective
  # index lags PyPI for fresh releases (typer 0.29.0, then filelock 4.2.10
  # missing -> `uv pip install` unresolvable on a fresh machine, tier-1).
  # uv queries the primary first and the extra for any version it lacks,
  # Primary index is the TUNA mirror and the extra is Aliyun
  # (2026-11-09): files.pythonhosted.org is unreachable from tier-1, so
  # PyPI can resolve but never deliver a wheel, and the Aliyun node
  # serving tier-1 lags fresh releases (filelock 4.2.10 missing). TUNA's
  # node serving tier-1 IS synced (proven by the proof/leaf-timing
  # diagnostic). These indexes also cover the legs' non-action uv/pip
  # calls (e.g. the cmake wheel install); the venv install itself uses
  # the shared setup-python-env action, which pins the same indexes.
  # The explicit primary here keeps any other uv/pip call from falling
  # back to the runner machine's config (Aliyun) — hence the explicit
  # primary here. UV_INDEX_STRATEGY
  # is load-bearing: uv's default first-index strategy uses the FIRST
  # index that has a package and never consults the others for it —
  # without unsafe-best-match the extra index is a no-op for packages the
  # primary already carries (proven by the proof/leaf-timing run).
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple/"
  PIP_EXTRA_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  # uv reads UV_INDEX_URL / UV_DEFAULT_INDEX BEFORE PIP_INDEX_URL, so the
  # primary above is a no-op unless both are pinned: the tier-1 runner image
  # exports them pointing at Aliyun (5e50710d: "no version of typer==0.29.0"
  # although TUNA listed it).
  UV_DEFAULT_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple/"
  UV_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple/"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  # Centralized runner configuration (scripts/ci/runner_config.py is the
  # single source of truth; these values mirror it at workflow level).
  NSE_RUNNER_LINUX_SELF_HOSTED_LABELS: "self-hosted,Linux,X64"
  # Two-tier self-hosted pool (scripts/ci/runner_config.py mirrors these).
  # Tier-1 is preferred for every Linux job; tier-2 takes over only when no
  # tier-1 runner is online+idle; GitHub-hosted is the last resort.
  NSE_RUNNER_LINUX_TIER1_LABELS: "self-hosted,Linux,X64,opselon-vm"
  NSE_RUNNER_LINUX_TIER2_LABELS: "self-hosted,Linux,X64,nexus-2core"
  NSE_RUNNER_LINUX_HOSTED: "ubuntu-latest"
  # Platform enablement flags. Windows/macOS default to manual-only; their
  # own dispatch workflows read these (absent => disabled => hosted).
  ENABLE_WINDOWS_SELF_HOSTED: ${{ vars.ENABLE_WINDOWS_SELF_HOSTED }}
  ENABLE_MACOS_SELF_HOSTED: ${{ vars.ENABLE_MACOS_SELF_HOSTED }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: ${{ secrets.USER_ID }}

jobs:
  # -------------------------------------------------------------------------
  # Preflight: runner availability (runs on GitHub-hosted infrastructure).
  # A composite action (not a reusable workflow) carries the decision: a
  # reusable-workflow callee cannot declare workflow-level outputs in this
  # repository (verified by direct experiment — every form tested is
  # rejected at load time with zero jobs).
  # -------------------------------------------------------------------------
  runner-select:
    name: Runner Selector (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runner_class: ${{ steps.select.outputs.runner_class }}
      self_hosted_eligible: ${{ steps.select.outputs.self_hosted_eligible }}
      selection_reason: ${{ steps.select.outputs.selection_reason }}
      self_hosted_labels: ${{ steps.select.outputs.self_hosted_labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select runner class (availability preflight)
        id: select
        uses: ./.github/actions/runner-select
        env:
          NSE_RUNNER_STATUS_TOKEN: ${{ secrets.NSE_RUNNER_STATUS_TOKEN }}
        with:
          platform: linux
          labels: ${{ env.NSE_RUNNER_LINUX_TIER1_LABELS }}
          fallback_labels: ${{ env.NSE_RUNNER_LINUX_TIER2_LABELS }}
          # A fork PR (head repo != this repo) is untrusted: never
          # self-hosted, never exposed to runner credentials.
          untrusted: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  # -------------------------------------------------------------------------
  # LINUX, SELF-HOSTED leg — used only when the preflight found an
  # online+idle runner in one of the two tiers (tier-1 opselon-vm preferred,
  # tier-2 nexus-2core fallback). The exact label set of the winning tier
  # arrives as a JSON array in self_hosted_labels. Mutually exclusive with
  # tests-linux-hosted: exactly one Linux leg reports.
  # -------------------------------------------------------------------------
  tests-linux-self-hosted:
    name: Py Tests (linux, self-hosted)
    needs: runner-select
    if: ${{ always() && needs.runner-select.outputs.runner_class == 'self-hosted' }}
    runs-on: ${{ fromJSON(needs.runner-select.outputs.self_hosted_labels) }}
    # Speed cap (2026-11-09, hard user requirement): no PR-feedback job
    # runs longer than 10 minutes. Lands WITH the tier-1 speedup (pytest
    # -n 8); on the 2-core tier-2 box this lane measured 1028s (run
    # 42678150060), so tier-2 cannot fit it — routing must prefer tier-1.
    timeout-minutes: 10
    env:
      NSE_RUNNER_CLASS: "self-hosted"
      NSE_SELECTION_REASON: ${{ needs.runner-select.outputs.selection_reason }}
      NSE_RUNNER_TIER_LABELS: ${{ needs.runner-select.outputs.self_hosted_labels }}
      # Test-database isolation (fail-closed): same pinning as ci.yml
      # quality-tests — this lane never talks to a real/shared database.
      # Proven by the assert step below (scripts/ci/assert_test_db_isolation.py).
      # The provider pin is a literal (job level is fine); the four temp
      # paths live in the "Pin test DB" step below, because
      # ${{ runner.temp }} is step-only — job-level env with it makes
      # GitHub reject the whole workflow at parse time (zero jobs ran).
      NSE_DATABASE__PROVIDER: sqlite
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Per-run temp paths for the test DBs (see the job-level env comment).
      # Must run before the assert step and before any pytest step.
      - name: Pin test DB to ephemeral sqlite paths
        shell: bash
        run: |
          echo "NSE_DATABASE__SQLITE_PATH=$RUNNER_TEMP/nse-ci-audit.sqlite" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nse-ci-audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_SETTINGS_DB=$RUNNER_TEMP/nse-ci-settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$RUNNER_TEMP/nse-ci-data" >> "$GITHUB_ENV"

      - name: Runner selection record
        shell: bash
        run: |
          echo "::notice::Py Tests (linux) on SELF-HOSTED (labels: $NSE_RUNNER_TIER_LABELS) runner. Reason: $NSE_SELECTION_REASON"
          echo "runner_class=self-hosted" >> "$GITHUB_ENV"

      # CENTRALIZATION (2026-11-10): the venv comes from the shared
      # setup-python-env action — ONE venv logic for every lane (the
      # inline install here drifted: it still used the old hash-bound
      # workspace venv + `uv pip install` while the action moved to a
      # stable venv + `uv pip sync`). The old "no actions/setup-python"
      # trap does not apply to the action: setup-python's silent fallback
      # to the system interpreter is harmless here because the action
      # provisions the exact Python via uv (UV_PYTHON_INSTALL_DIR) and
      # builds the venv from it — proven on these same runners by the
      # ci.yml quality lanes.
      - name: Set up Python environment (shared action)
        id: env
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          runner-class: self-hosted

      - name: Report environment (cache-reuse evidence)
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Environment (runner_class=${{ env.NSE_RUNNER_CLASS }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| venv | ${{ steps.env.outputs.venv_dir }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| python | ${{ steps.env.outputs.venv_python }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UV_CACHE_DIR | \`$UV_CACHE_DIR\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UV_PYTHON_INSTALL_DIR | \`$UV_PYTHON_INSTALL_DIR\` |" >> "$GITHUB_STEP_SUMMARY"

      # Prove the DB pinning (provider at job level, paths from the pin
      # step above) through the repo's own resolver, before any test step
      # can open a database.
      - name: Assert test-database isolation (fail-closed)
        run: python scripts/ci/assert_test_db_isolation.py

      - name: Decide lane (classifier + event policy)
        id: lane
        shell: bash
        run: scripts/ci/decide_os_lane.bash linux

      - name: Run C-planned targeted subset (PR fast lane)
        if: steps.lane.outputs.mode == 'SKEW'
        shell: bash
        run: |
          set +e
          # Change-based selection only: the C17 engine plans, Python
          # executes. No fixed list runs anymore (windows_skew_suite.txt
          # stays only as the T3 tier manifest for the protection ledger).
          # cmake is preinstalled on hosted runners; on self-hosted tiers
          # the portable wheel from the venv (already first on PATH)
          # covers it. run_test_plan.py builds + verifies the engine.
          if ! command -v cmake >/dev/null 2>&1; then
            uv pip install --quiet cmake || true
            for d in "${{ steps.env.outputs.venv_dir }}/bin" "${{ steps.env.outputs.venv_dir }}/Scripts" "$HOME/.local/bin"; do
              if [ -x "$d/cmake" ] || [ -x "$d/cmake.exe" ]; then export PATH="$d:$PATH"; break; fi
            done
          fi
          # Shallow checkouts cannot compute the PR merge-base; the shared
          # script fetches base+head bloblessly, verifies merge-base, and
          # escalates to unshallow on a virgin clone (see
          # scripts/ci/fetch_planner_history.bash). HEAD is the REAL PR
          # head, not github.sha: on pull_request github.sha is the
          # ephemeral merge commit, which the depth-1 checkout leaves
          # shallow-grafted, so the diff finds no merge base and the
          # planner fails rc=3 (2026-11-09). An empty base (dispatch)
          # falls back to HEAD~1 inside the script.
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          bash scripts/ci/fetch_planner_history.bash "$BASE" "$HEAD"
          XDIST="$(python -c 'import os; print(os.cpu_count() or 2)')"
          if [ "$XDIST" -gt 8 ]; then XDIST=8; fi
          python scripts/ci/run_test_plan.py \
            --repo-root . \
            --base "$BASE" \
            --head "$HEAD" \
            --event "${{ github.event_name }}" \
            --mode targeted \
            --native-binary scripts/ci/native/build/nse-ci-engine \
            --xdist "$XDIST" \
            --pytest-extra "-q --tb=short --junitxml=pytest-os-skew.txt.xml" \
            --out-dir test-plan-os
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Run Full Critical Suite (main push / schedule / dispatch)
        if: steps.lane.outputs.mode == 'FULL'
        shell: bash
        run: |
          set +e
          # Wall-clock budget tests deselected from this coverage run (see
          # the dedicated perf-budget step below): coverage + xdist inflates
          # perf_counter measurements past their floors on the 2-core box.
          python -c "import pathlib, subprocess, sys; p = pathlib.Path('tests/critical_suite.txt'); lines = [l.strip() for l in p.read_text().splitlines() if l.strip() and not l.startswith('#')]; sys.exit(subprocess.run(['pytest'] + lines + ['-n', 'auto', '--dist', 'loadgroup', '--cov=src', '--cov-report=term-missing', '--deselect', 'tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents', '--deselect', 'tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark', '-q']).returncode)" \
                 > "pytest-linux.txt" 2>&1
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          cat "pytest-linux.txt" | tail -60
          exit $rc

      - name: Performance budget — wall-clock budgets (uninstrumented)
        if: steps.lane.outputs.mode == 'FULL'
        shell: bash
        run: |
          set +e
          # FULL mode runs the critical suite WITH coverage, so the
          # wall-clock budget tests are deselected there (coverage + xdist
          # inflates perf_counter measurements past their floors on the
          # 2-core runner; measured 2026-11-09) and run here instead —
          # uninstrumented, single-process, blocking. SKEW mode needs no
          # step: its planner run carries no --cov, so the tests already
          # run uninstrumented there.
          pytest tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark \
            -q --tb=short -p no:cacheprovider \
            --junitxml=pytest-perf-budget.xml \
            2>&1 | tee pytest-perf-budget.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::wall-clock budget tripped while UNINSTRUMENTED — the code itself got slower (see pytest-perf-budget.xml)"
            exit "$rc"
          fi
          grep -h "gate cost" pytest-perf-budget.txt || true
          echo "perf-budget: PASS (wall-clock budgets hold, uninstrumented)"

      - name: Lane report (always — required-context honesty contract)
        if: always()
        shell: bash
        run: |
          MODE="${{ steps.lane.outputs.mode }}"
          if [ "$MODE" = "SKIP-REPORT" ]; then
            echo "## Py Tests (linux, self-hosted): GREEN — Quality owns test execution on PR/push/schedule (one execution per PR); this leg runs the FULL suite on explicit dispatch only" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRIT_RC+set}" ]; then
            echo "::error::mode=$MODE but pytest step never produced a result — failing closed"
            exit 1
          fi
          echo "## Py Tests (linux, self-hosted): mode=$MODE rc=$CRIT_RC runner=self-hosted" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$CRIT_RC" -eq 0 ]

      - name: Telegram - OS tests finished
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/ci/telegram_notify.py --results ci-results os-finished --os "linux-self-hosted" || true

  # -------------------------------------------------------------------------
  # LINUX, GITHUB-HOSTED fallback leg — offline/busy/disabled runner,
  # missing credential, API error, or untrusted fork PR.
  # -------------------------------------------------------------------------
  tests-linux-hosted:
    name: Py Tests (linux, hosted)
    needs: runner-select
    if: ${{ always() && needs.runner-select.outputs.runner_class != 'self-hosted' }}
    # NOTE: runs-on may NOT use the `env` context (GitHub allows only
    # github/needs/strategy/matrix/vars/inputs here), so the centralized
    # fallback value is inlined. scripts/ci/runner_config.py is the single
    # source of truth for this literal.
    runs-on: ubuntu-latest
    # Speed cap (2026-11-09, hard user requirement): no PR-feedback job
    # runs longer than 10 minutes. The hosted fallback runs the same full
    # suite in ~8 min (measured), so 10 min is the fail-closed guard.
    timeout-minutes: 10
    env:
      NSE_RUNNER_CLASS: "github-hosted"
      NSE_SELECTION_REASON: ${{ needs.runner-select.outputs.selection_reason }}
      # Test-database isolation (fail-closed): same pinning as ci.yml
      # quality-tests — this lane never talks to a real/shared database.
      # Proven by the assert step below (scripts/ci/assert_test_db_isolation.py).
      # The provider pin is a literal (job level is fine); the four temp
      # paths live in the "Pin test DB" step below, because
      # ${{ runner.temp }} is step-only — job-level env with it makes
      # GitHub reject the whole workflow at parse time (zero jobs ran).
      NSE_DATABASE__PROVIDER: sqlite
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Per-run temp paths for the test DBs (see the job-level env comment).
      # Must run before the assert step and before any pytest step.
      - name: Pin test DB to ephemeral sqlite paths
        shell: bash
        run: |
          echo "NSE_DATABASE__SQLITE_PATH=$RUNNER_TEMP/nse-ci-audit.sqlite" >> "$GITHUB_ENV"
          echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nse-ci-audit.db" >> "$GITHUB_ENV"
          echo "NEXUS_SETTINGS_DB=$RUNNER_TEMP/nse-ci-settings.db" >> "$GITHUB_ENV"
          echo "NEXUS_DATA_ROOT=$RUNNER_TEMP/nse-ci-data" >> "$GITHUB_ENV"

      - name: Runner selection record
        shell: bash
        run: |
          echo "::notice::Py Tests (linux) on GITHUB-HOSTED runner. Reason: $NSE_SELECTION_REASON"
          echo "runner_class=github-hosted" >> "$GITHUB_ENV"

      # CENTRALIZATION (2026-11-10): the venv comes from the shared
      # setup-python-env action — ONE venv logic for every lane (the
      # inline install here drifted: it still used the old hash-bound
      # workspace venv + `uv pip install` while the action moved to a
      # stable venv + `uv pip sync`). On hosted runners the action uses
      # a workspace venv + the GitHub uv cache, as before.
      - name: Set up Python environment (shared action)
        id: env
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          runner-class: github-hosted

      - name: Report environment (cache-reuse evidence)
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Environment (runner_class=${{ env.NSE_RUNNER_CLASS }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| venv | ${{ steps.env.outputs.venv_dir }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| python | ${{ steps.env.outputs.venv_python }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UV_CACHE_DIR | \`$UV_CACHE_DIR\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UV_PYTHON_INSTALL_DIR | \`$UV_PYTHON_INSTALL_DIR\` |" >> "$GITHUB_STEP_SUMMARY"

      # Prove the DB pinning (provider at job level, paths from the pin
      # step above) through the repo's own resolver, before any test step
      # can open a database.
      - name: Assert test-database isolation (fail-closed)
        run: python scripts/ci/assert_test_db_isolation.py

      - name: Decide lane (classifier + event policy)
        id: lane
        shell: bash
        run: scripts/ci/decide_os_lane.bash linux

      - name: Run C-planned targeted subset (PR fast lane)
        if: steps.lane.outputs.mode == 'SKEW'
        shell: bash
        run: |
          set +e
          # Change-based selection only: the C17 engine plans, Python
          # executes. No fixed list runs anymore (windows_skew_suite.txt
          # stays only as the T3 tier manifest for the protection ledger).
          # cmake is preinstalled on hosted runners; on self-hosted tiers
          # the portable wheel from the venv (already first on PATH)
          # covers it. run_test_plan.py builds + verifies the engine.
          if ! command -v cmake >/dev/null 2>&1; then
            uv pip install --quiet cmake || true
            for d in "${{ steps.env.outputs.venv_dir }}/bin" "${{ steps.env.outputs.venv_dir }}/Scripts" "$HOME/.local/bin"; do
              if [ -x "$d/cmake" ] || [ -x "$d/cmake.exe" ]; then export PATH="$d:$PATH"; break; fi
            done
          fi
          # Shallow checkouts cannot compute the PR merge-base; the shared
          # script fetches base+head bloblessly, verifies merge-base, and
          # escalates to unshallow on a virgin clone (see
          # scripts/ci/fetch_planner_history.bash). HEAD is the REAL PR
          # head, not github.sha: on pull_request github.sha is the
          # ephemeral merge commit, which the depth-1 checkout leaves
          # shallow-grafted, so the diff finds no merge base and the
          # planner fails rc=3 (2026-11-09). An empty base (dispatch)
          # falls back to HEAD~1 inside the script.
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          bash scripts/ci/fetch_planner_history.bash "$BASE" "$HEAD"
          XDIST="$(python -c 'import os; print(os.cpu_count() or 2)')"
          if [ "$XDIST" -gt 8 ]; then XDIST=8; fi
          python scripts/ci/run_test_plan.py \
            --repo-root . \
            --base "$BASE" \
            --head "$HEAD" \
            --event "${{ github.event_name }}" \
            --mode targeted \
            --native-binary scripts/ci/native/build/nse-ci-engine \
            --xdist "$XDIST" \
            --pytest-extra "-q --tb=short --junitxml=pytest-os-skew.txt.xml" \
            --out-dir test-plan-os
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Run Full Critical Suite (main push / schedule / dispatch)
        if: steps.lane.outputs.mode == 'FULL'
        shell: bash
        run: |
          set +e
          # Wall-clock budget tests deselected from this coverage run (see
          # the dedicated perf-budget step below): coverage + xdist inflates
          # perf_counter measurements past their floors on the 2-core box.
          python -c "import pathlib, subprocess, sys; p = pathlib.Path('tests/critical_suite.txt'); lines = [l.strip() for l in p.read_text().splitlines() if l.strip() and not l.startswith('#')]; sys.exit(subprocess.run(['pytest'] + lines + ['-n', 'auto', '--dist', 'loadgroup', '--cov=src', '--cov-report=term-missing', '--deselect', 'tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents', '--deselect', 'tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark', '-q']).returncode)" \
                 > "pytest-linux.txt" 2>&1
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          cat "pytest-linux.txt" | tail -60
          exit $rc

      - name: Performance budget — wall-clock budgets (uninstrumented)
        if: steps.lane.outputs.mode == 'FULL'
        shell: bash
        run: |
          set +e
          # FULL mode runs the critical suite WITH coverage, so the
          # wall-clock budget tests are deselected there (coverage + xdist
          # inflates perf_counter measurements past their floors on the
          # 2-core runner; measured 2026-11-09) and run here instead —
          # uninstrumented, single-process, blocking. SKEW mode needs no
          # step: its planner run carries no --cov, so the tests already
          # run uninstrumented there.
          pytest tests/unit/news/ingest/test_payload_value_gate_benchmark.py::test_gate_cost_is_far_cheaper_than_the_write_it_prevents tests/integration/test_model_promotion_pipeline_e2e.py::test_promotion_transaction_happy_path_and_benchmark \
            -q --tb=short -p no:cacheprovider \
            --junitxml=pytest-perf-budget.xml \
            2>&1 | tee pytest-perf-budget.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::wall-clock budget tripped while UNINSTRUMENTED — the code itself got slower (see pytest-perf-budget.xml)"
            exit "$rc"
          fi
          grep -h "gate cost" pytest-perf-budget.txt || true
          echo "perf-budget: PASS (wall-clock budgets hold, uninstrumented)"

      - name: Lane report (always — required-context honesty contract)
        if: always()
        shell: bash
        run: |
          MODE="${{ steps.lane.outputs.mode }}"
          if [ "$MODE" = "SKIP-REPORT" ]; then
            echo "## Py Tests (linux, github-hosted): GREEN — Quality owns test execution on PR/push/schedule (one execution per PR); this leg runs the FULL suite on explicit dispatch only" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRIT_RC+set}" ]; then
            echo "::error::mode=$MODE but pytest step never produced a result — failing closed"
            exit 1
          fi
          echo "## Py Tests (linux, github-hosted): mode=$MODE rc=$CRIT_RC runner=github-hosted" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$CRIT_RC" -eq 0 ]

      - name: Telegram - OS tests finished
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/ci/telegram_notify.py --results ci-results os-finished --os "linux-github-hosted" || true

  # -------------------------------------------------------------------------
  # WINDOWS / macOS — required-context emitters (NO test execution).
  # The real suites live in tests-windows.yml / tests-macos.yml (dispatch).
  # These contexts exist because branch protection still requires the exact
  # names; they honestly report that no platform test ran on this commit.
  # -------------------------------------------------------------------------
  tests-windows-ctx:
    name: Py Tests (windows-latest)
    needs: runner-select
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit required-context status (no test execution)
        shell: bash
        run: |
          set -e
          echo "::notice::Windows tests are manual-only (workflow_dispatch): Actions → tests-windows.yml → Run workflow. This context reports ROUTING, not a test verdict."
          {
            echo "## Py Tests (windows-latest): NOT EXECUTED — Windows is manual-only"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| automatic execution | disabled (2026-11 runner-routing architecture) |"
            echo "| manual workflow | \`.github/workflows/tests-windows.yml\` (workflow_dispatch) |"
            echo "| self-hosted integration | implemented, flag \`ENABLE_WINDOWS_SELF_HOSTED\` (default false) |"
            echo "| linux routing decision | ${{ needs.runner-select.outputs.selection_reason }} |"
            echo ""
            echo "This context exists because branch protection still requires the"
            echo "\`Py Tests (windows-latest)\` name. It honestly reports that no"
            echo "Windows test executed on this commit. Replace it in protection"
            echo "with the manual lane evidence (see docs/CI_ARCHITECTURE.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  tests-macos-ctx:
    name: Py Tests (macos-latest)
    needs: runner-select
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit required-context status (no test execution)
        shell: bash
        run: |
          set -e
          echo "::notice::macOS tests are manual-only (workflow_dispatch): Actions → tests-macos.yml → Run workflow. This context reports ROUTING, not a test verdict."
          {
            echo "## Py Tests (macos-latest): NOT EXECUTED — macOS is manual-only"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| automatic execution | disabled (2026-11 runner-routing architecture) |"
            echo "| manual workflow | \`.github/workflows/tests-macos.yml\` (workflow_dispatch) |"
            echo "| self-hosted integration | implemented, flag \`ENABLE_MACOS_SELF_HOSTED\` (default false) |"
            echo "| linux routing decision | ${{ needs.runner-select.outputs.selection_reason }} |"
            echo ""
            echo "This context exists because branch protection still requires the"
            echo "\`Py Tests (macos-latest)\` name. It honestly reports that no"
            echo "macOS test executed on this commit."
          } >> "$GITHUB_STEP_SUMMARY"

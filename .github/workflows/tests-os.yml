name: Tests (OS Matrix)

# Multi-OS Python gate. ci.yml runs the Critical Suite on ubuntu-latest only,
# but NSE's PRIMARY runtime is Windows (packaged EXE, beforePush.ps1). This
# workflow proves the same curated regression net runs on Windows and macOS so
# a Linux-only green does not mask an OS-specific break (path/CRLF/encoding).
# ubuntu-latest is intentionally NOT repeated here — it is covered by ci.yml.

on:
  push:
    branches: [ci-tests]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: ${{ secrets.USER_ID }}

jobs:
  tests-os:
    name: Py Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,web]"
          pip install pytest-cov

      - name: Run Critical Suite
        shell: bash
        run: |
          set +e
          python -c "import pathlib, subprocess, sys; p = pathlib.Path('tests/critical_suite.txt'); lines = [l.strip() for l in p.read_text().splitlines() if l.strip() and not l.startswith('#')]; sys.exit(subprocess.run(['pytest'] + lines + ['-n', 'auto', '--dist', 'loadgroup', '--cov=src', '--cov-report=term-missing', '-q']).returncode)" \
                 -n auto \
                 --dist loadgroup \
                 --cov=src \
                 --cov-report=term-missing \
                 -q > "pytest-${{ matrix.os }}.txt" 2>&1
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          cat "pytest-${{ matrix.os }}.txt"
          exit $rc

      - name: Upload per-OS log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-os-${{ matrix.os }}-${{ github.run_number }}
          path: pytest-${{ matrix.os }}.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Telegram - OS tests finished
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results ci-results os-finished || true

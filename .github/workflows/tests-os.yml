name: Tests (OS Matrix)

# Multi-OS Python gate — restructured by the radical test reconstruction
# (2026-09-14). The REQUIRED CONTEXT NAMES ARE UNCHANGED (branch protection
# untouched; release_auth_gate.REQUIRED_MAIN_CI_CHECKS unchanged). What
# changed is WHAT each context executes per event, so a normal PR no longer
# pays three full copies of the same suite:
#
#   BEFORE (measured, GitHub run 34866523254, 2026-09-14):
#     ubuntu full suite (ci.yml quality, 6 min) + windows full suite (16 min)
#     + macOS full suite (5-14 min) on EVERY PR/push — identical manifest thrice;
#     merge latency was set by the slowest OS torch install.
#   AFTER:
#     PR:        windows runs the OS-SKEWED subset (path/CRLF/launcher/installer
#                defects only Linux cannot see); macOS always-reports green in
#                ~1 min (DEC-0008 pattern — a required context must not go
#                MISSING on PRs).
#     main push: Windows runs the FULL critical suite (product-truth evidence
#                on the commit that tags become releases from); macOS reports
#                SKIP-REPORT (DevOps audit P9, 2026-11 - cost trim, drift
#                detection stays on the Monday schedule).
#     Monday schedule: full suite both OSes (platform drift catch-up).
#     workflow_dispatch: full suite (+ optional ci.yml-style full flag).
#
# Nothing ships for macOS (release.yml builds windows-x64 only) — its full-suite
# role is early-warning drift detection, which the main-push lane provides
# within minutes of merge instead of blocking the PR that caused it.

on:
  push:
    branches: [main, develop, ci-tests]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Monday 07:17 UTC platform drift sweep (full suite both OSes).
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Force the FULL critical suite on every OS leg (skip PR fast shapes)"
        type: boolean
        default: false

concurrency:
  group: tests-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: ${{ secrets.USER_ID }}

jobs:
  tests-os:
    name: Py Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide lane (classifier + event policy)
        id: lane
        shell: bash
        run: |
          # FULL = full critical_suite.txt. SKEW = Windows-only defect subset
          # (windows only; macOS has no skew-suite -> SKIP-REPORT there).
          # SKIP-REPORT = required-context always-report green (no torch).
          MODE=FULL
          case "${{ github.event_name }}" in
            pull_request)
              if [ "${{ matrix.os }}" = "macos-latest" ]; then MODE=SKIP-REPORT; else MODE=SKEW; fi ;;
            push)
              # DevOps audit P9 (2026-11): on main pushes Windows runs the FULL
              # critical suite; macOS returns to SKIP-REPORT. macOS ships
              # nothing (release.yml builds windows-x64 only) and its FULL-suite
              # role is platform-drift detection, which the Monday 07:17 UTC
              # schedule (below) still runs on both OSes. Measured cost of the
              # per-push macOS FULL leg: ~8m25s at the 10x macOS multiplier =
              # ~84 of the ~119 billable minutes of a main-push tests-os run.
              if [ "${{ github.ref_name }}" = "main" ]; then
                if [ "${{ matrix.os }}" = "macos-latest" ]; then MODE=SKIP-REPORT; else MODE=FULL; fi
              elif [ "${{ matrix.os }}" = "macos-latest" ]; then MODE=SKIP-REPORT;
              else MODE=SKEW; fi ;;
            schedule) MODE=FULL ;;
            workflow_dispatch)
              if [ "${{ inputs.full_suite }}" = "true" ] || [ "${{ matrix.os }}" = "windows-latest" ]; then MODE=FULL; else MODE=SKIP-REPORT; fi ;;
          esac
          if [ "$MODE" != "SKIP-REPORT" ]; then
            # Canonical classifier: no Python in the diff -> nothing to run.
            # Fail-open on uncertainty (empty diff / classifier error => run).
            # ROBUSTNESS (first-run failure 34908840443): the default checkout
            # has no local origin/<base> ref, and bash -e/pipefail made an
            # unresolvable `git diff main...HEAD` (exit 128) kill this step
            # BEFORE mode was written. Every git probe below is ||-guarded.
            PY=python; command -v python >/dev/null 2>&1 || PY=python3
            BASE="${GITHUB_BASE_REF:-}"
            NAMES=""
            if [ -n "$BASE" ]; then
              git fetch -q --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
              NAMES=$(git diff --name-only "origin/$BASE...HEAD" 2>/dev/null | tr '\n' ' ' || true)
            fi
            if [ -z "${NAMES// /}" ]; then
              BEFORE="${{ github.event.before }}"
              for REF in "$BEFORE...HEAD" "HEAD~1...HEAD" "HEAD^...HEAD"; do
                case "$REF" in "...HEAD") continue;; esac
                NAMES=$(git diff --name-only "$REF" 2>/dev/null | tr '\n' ' ' || true)
                [ -n "${NAMES// /}" ] && break
              done
            fi
            if [ -z "${NAMES// /}" ]; then
              # every discovery failed => fail OPEN (force the python lane)
              NAMES="src/force_python_lane.py"
            fi
            LANES=$($PY scripts/ci/classify_changes.py --files "$NAMES" 2>/dev/null || echo '{}')
            echo "lanes=$LANES"
            if ! echo "$LANES" | grep -Eq '"python": *true'; then
              echo "python-lane=false -> SKIP-REPORT"
              MODE=SKIP-REPORT
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: steps.lane.outputs.mode != 'SKIP-REPORT'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv (pinned — the canonical lock tool)
        if: steps.lane.outputs.mode != 'SKIP-REPORT'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install via lock (hash-verified requirements.lock)
        if: steps.lane.outputs.mode != 'SKIP-REPORT'
        shell: bash
        run: |
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Run OS-skewed Windows subset (PR fast lane)
        if: steps.lane.outputs.mode == 'SKEW'
        shell: bash
        run: |
          set +e
          python -c "import pathlib, subprocess, sys; p = pathlib.Path('tests/windows_skew_suite.txt'); lines = [l.strip() for l in p.read_text().splitlines() if l.strip() and not l.startswith('#')]; sys.exit(subprocess.run(['pytest'] + lines + ['-n', 'auto', '--dist', 'loadgroup', '-q', '--tb=short', '--junitxml=pytest-os-skew.txt.xml']).returncode)"
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Run Full Critical Suite (main push / schedule / dispatch)
        if: steps.lane.outputs.mode == 'FULL'
        shell: bash
        run: |
          set +e
          python -c "import pathlib, subprocess, sys; p = pathlib.Path('tests/critical_suite.txt'); lines = [l.strip() for l in p.read_text().splitlines() if l.strip() and not l.startswith('#')]; sys.exit(subprocess.run(['pytest'] + lines + ['-n', 'auto', '--dist', 'loadgroup', '--cov=src', '--cov-report=term-missing', '-q']).returncode)" \
                 > "pytest-${{ matrix.os }}.txt" 2>&1
          rc=$?
          echo "CRIT_RC=$rc" >> "$GITHUB_ENV"
          cat "pytest-${{ matrix.os }}.txt" | tail -60
          exit $rc

      - name: Lane report (always — required-context honesty contract)
        if: always()
        shell: bash
        run: |
          MODE="${{ steps.lane.outputs.mode }}"
          if [ "$MODE" = "SKIP-REPORT" ]; then
            echo "## Py Tests (${{ matrix.os }}): GREEN — lane classifier decided no execution required (PR/develop-push shape; this context executes the FULL suite on main push, Monday schedule, and dispatch)" | tee -a "$GITHUB_STEP_SUMMARY"
            # Honesty guard: SKIP-REPORT is only legitimate when produced by
            # the classifier or the documented event policy above. Re-derive
            # here and FAIL if this job was ever marked green while a Python
            # lane was required: (mode was decided above; nothing to re-run).
            exit 0
          fi
          if [ -z "${CRIT_RC+set}" ]; then
            echo "::error::mode=$MODE but pytest step never produced a result — failing closed"
            exit 1
          fi
          echo "## Py Tests (${{ matrix.os }}): mode=$MODE rc=$CRIT_RC" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$CRIT_RC" -eq 0 ]

      - name: Telegram - OS tests finished
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py --results ci-results os-finished --os "${{ matrix.os }}" || true

name: Performance Benchmark

on:
  # Semi-monthly regression watch ONLY (2026-11-10, user directive):
  # no PR/push triggers — the PR path is the Quality wall-clock budget
  # step, and this hosted benchmark runs on the 1st & 15th (~15 days)
  # plus manual dispatch. Was PR/push path-filtered + weekly; the
  # hosted minutes and the PR noise are not worth a per-PR regression
  # table.
  workflow_dispatch:
  schedule:
    # Semi-monthly regression watch, even without a PR touching the paths.
    - cron: "17 4 1,15 * *"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  benchmark:
    name: Bench (exit policy · calibration · web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install runtime + bench dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110,<1.0" \
            "httpx>=0.26,<1.0" \
            "pytest>=8" \
            "pytest-asyncio>=0.23" \
            "numpy>=1.26,<3.0" \
            "structlog>=24" \
            "pydantic>=2.7,<3.0" \
            "pydantic-settings>=2.2,<3.0"

      - name: Run benchmarks (bench units exit non-zero on regression)
        id: bench
        run: |
          python tests/bench/run_benchmarks.py \
            --baseline-json .bench-baseline.json \
            --report-json .bench-report.json \
            --fail-on-regression \
            --max-regression-pct 15

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: .bench-report.json
          if-no-files-found: warn


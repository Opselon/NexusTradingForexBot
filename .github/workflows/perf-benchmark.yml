name: Performance Benchmark

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/nexus_scalp/web/**"
      - "src/nexus_scalp/models/**"
      - "src/nexus_scalp/experience/**"
      - "tests/bench/**"
      - ".github/workflows/perf-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "src/nexus_scalp/web/**"
      - "src/nexus_scalp/models/**"
      - "tests/bench/**"
  workflow_dispatch:
  schedule:
    # Weekly regression watch, even without a PR touching the path filter.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  benchmark:
    name: Bench (exit policy · calibration · web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install runtime + bench dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110,<1.0" \
            "httpx>=0.26,<1.0" \
            "pytest>=8" \
            "pytest-asyncio>=0.23" \
            "numpy>=1.26,<3.0" \
            "structlog>=24" \
            "pydantic>=2.7,<3.0" \
            "pydantic-settings>=2.2,<3.0"

      - name: Run benchmarks (bench units exit non-zero on regression)
        id: bench
        run: |
          python tests/bench/run_benchmarks.py \
            --baseline-json .bench-baseline.json \
            --report-json .bench-report.json \
            --fail-on-regression \
            --max-regression-pct 15

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: .bench-report.json
          if-no-files-found: warn

      - name: Report on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('.bench-report.json', 'utf8'));
            } catch (error) {
              core.warning('benchmark report missing; see job logs');
              return;
            }
            const rows = report.benchmarks.map(b => {
              const delta = b.baseline_us == null
                ? '`new`'
                : `${((b.mean_us - b.baseline_us) / b.baseline_us * 100).toFixed(1)}%`;
              return `| ${b.name} | ${(b.mean_us / 1000).toFixed(1)} ms | ${delta} | ${b.calls} |`;
            }).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ⏱ Performance benchmark',
                '',
                '| benchmark | mean | vs baseline | calls |',
                '|---|---|---|---|',
                rows,
                '',
                `tool: \`${report.tool}\` · verdict: **${report.verdict}** · guide noise floor: ±${report.noise_floor_pct}%`,
                '',
                'A regression > ' + report.max_regression_pct + '% fails this job; timing noise below the floor is not reported as a regression.'
              ].join('\n')
            });

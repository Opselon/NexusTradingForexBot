name: Security

on:
  pull_request:
    branches: [main, develop]
    # CI quota diet (2026-11): CodeQL+Trivy only when code/dependency
    # surfaces actually changed. Docs-only PRs do not pay for security.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "go-api/**"
      - "frontend/**"
      - "requirements*.lock"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/security.yml"
      - ".github/workflows/**"
  push:
    branches: [main, ci-tests]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "go-api/**"
      - "frontend/**"
      - "requirements*.lock"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/security.yml"
      - ".github/workflows/**"
  schedule:
    # CI quota diet (2026-11): weekly -> semi-monthly full sweep.
    - cron: "0 6 1,15 * *"   # 1st & 15th, 06:00 UTC
  workflow_dispatch:

# All third-party actions are pinned to immutable commit SHAs
# (supply-chain hardening). Update deliberately, never via
# floating tags.
permissions:
  contents: read
  security-events: write
  actions: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  USER_ID: ${{ secrets.USER_ID }}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Telegram - security scan complete
        continue-on-error: true
        run: |
          python scripts/ci/telegram_notify.py security --scan Trivy --status "${{ job.status }}" || true

name: CI Final Summary (AI)

# BUG-300/303/304 — FINAL EVIDENCE + AI TRIAGE + DELIVERY.
# workflow_run fires AFTER each watched workflow finishes. This lane owns the
# final evidence and fan-out to GitHub Step Summary, Telegram and the
# associated PR conversation. It is advisory and never gates the watched job.

on:
  push:
    branches: [main, develop]
  workflow_run:
    workflows:
      - "CI"
      - "Release"
      - "Security"
      - "Tests (OS Matrix)"
      - "JS Tests"
      - "Docs"
      - "Dependency Lock & Migration Safety"
      - "Lockfile Diff"
      - "OSV Dependency Scan"
      - "Docker Build & Publish"
      - "Go API"
      - "Nightly Deep QA"
      - "Nightly Client E2E (Docker)"
      - "Official model publication"
      - "QA Deep Assurance"
      - "Nightly ML Benchmark"
      - "PR Evidence Report"
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ci-summary-\${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
  USER_ID: \${{ secrets.USER_ID }}
  AI_HOST: \${{ secrets.AI_HOST }}
  AI_KEY: \${{ secrets.AI_KEY }}

jobs:
  final-summary:
    name: AI Final Summary
    if: \${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Prepare isolated summary environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-summary-venv
          CI_PYTHON="$PWD/.ci-summary-venv/bin/python"
          echo "python=$CI_PYTHON" >> "$GITHUB_OUTPUT"

          "$CI_PYTHON" -m pip install --disable-pip-version-check --quiet -e . --no-deps
          "$CI_PYTHON" -m pip install --disable-pip-version-check --quiet \
            "pydantic>=2.6.0,<3.0.0" \
            "pydantic-settings>=2.1.0,<3.0.0" \
            "pyyaml>=6.0.1,<7.0.0" \
            "structlog>=24.1.0,<27.0.0" \
            "numpy>=1.26.0,<3.0.0"

          "$CI_PYTHON" - <<'PY'
          import importlib

          required = {
              "pydantic": "pydantic",
              "pydantic_settings": "pydantic_settings",
              "yaml": "yaml",
              "structlog": "structlog",
              "numpy": "numpy",
          }
          missing = []
          for module, label in required.items():
              try:
                  importlib.import_module(module)
              except Exception as exc:
                  missing.append(f"{label}: {type(exc).__name__}: {exc}")
          if missing:
              raise SystemExit("Summary environment import failure:\n" + "\n".join(missing))
          print("Summary environment: READY")
          PY

      - name: Resolve target run + associated PR
        id: target
        env:
          GH_TOKEN: \${{ github.token }}
          TARGET_RUN_ID: \${{ github.event.workflow_run.id }}
          TARGET_WORKFLOW: \${{ github.event.workflow_run.name }}
          TARGET_CONCLUSION: \${{ github.event.workflow_run.conclusion }}
          TARGET_EVENT: \${{ github.event.workflow_run.event }}
          TARGET_SHA: \${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: \${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail

          echo "run_id=$TARGET_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "workflow=$TARGET_WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "conclusion=$TARGET_CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "event=$TARGET_EVENT" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

          PR="\${{ github.event.workflow_run.pull_requests[0].number }}"
          PR_SOURCE="workflow_run.pull_requests"
          PR_REASON="resolved_from_workflow_run_payload"

          if [[ -z "$PR" ]]; then
            PR_SOURCE="commit_pulls_api"
            ASSOCIATED_JSON="$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/\${GITHUB_REPOSITORY}/commits/\${TARGET_SHA}/pulls" 2>/dev/null || echo '[]')"

            PR="$(printf '%s' "$ASSOCIATED_JSON" | jq -r '
              [ .[] | select(.number != null) |
                {number, state, merged_at}
              ] |
              sort_by(
                (if .state == "open" then 0 else 1 end),
                (.merged_at // "")
              ) |
              .[0].number // empty
            ')"

            if [[ -n "$PR" ]]; then
              PR_REASON="resolved_from_exact_commit_association"
            else
              PR_REASON="no_pull_request_associated_with_exact_target_sha"
            fi
          fi

          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "pr_source=$PR_SOURCE" >> "$GITHUB_OUTPUT"
          echo "pr_reason=$PR_REASON" >> "$GITHUB_OUTPUT"

          python - "$TARGET_RUN_ID" "$TARGET_WORKFLOW" "$TARGET_CONCLUSION" "$TARGET_EVENT" \
            "$TARGET_SHA" "$TARGET_BRANCH" "$PR" "$PR_SOURCE" "$PR_REASON" <<'PY'
          import json
          import sys
          from pathlib import Path

          keys = [
              "run_id", "workflow", "conclusion", "event", "sha",
              "branch", "pr", "pr_source", "pr_reason",
          ]
          Path("ci-target.json").write_text(
              json.dumps(dict(zip(keys, sys.argv[1:])), indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "Target run=$TARGET_RUN_ID sha=$TARGET_SHA pr=\${PR:-none} source=$PR_SOURCE reason=$PR_REASON"

      - name: Collect whole-run evidence
        env:
          CI_PYTHON: \${{ steps.env.outputs.python }}
          GH_TOKEN: \${{ github.token }}
          TARGET_RUN_ID: \${{ steps.target.outputs.run_id }}
          TARGET_WORKFLOW: \${{ steps.target.outputs.workflow }}
          TARGET_EVENT: \${{ steps.target.outputs.event }}
          PR_NUMBER: \${{ steps.target.outputs.pr }}
        shell: bash
        run: |
          set +e
          mkdir -p ci-results/run-info
          "$CI_PYTHON" scripts/ci/ci_summary.py \
            --out ci-results/run-info/summary-evidence.json
          RC=$?
          printf '{"exit_code":%s,"status":"%s"}\n' "$RC" \
            "$([[ $RC -eq 0 ]] && echo OK || echo FAILED)" \
            > ci-results/run-info/evidence-collector.json
          if [[ $RC -ne 0 ]]; then
            echo "::warning::Whole-run evidence collector exited $RC; continuing with explicit evidence status."
          fi
          exit 0

      - name: AI analysis + Telegram delivery
        id: ai
        if: \${{ always() }}
        continue-on-error: true
        env:
          CI_PYTHON: \${{ steps.env.outputs.python }}
          GH_TOKEN: \${{ github.token }}
          TARGET_RUN_ID: \${{ steps.target.outputs.run_id }}
          TARGET_WORKFLOW: \${{ steps.target.outputs.workflow }}
          TARGET_EVENT: \${{ steps.target.outputs.event }}
          PR_NUMBER: \${{ steps.target.outputs.pr }}
        shell: bash
        run: |
          set +e
          mkdir -p ci-results/run-info
          KIND="$("$CI_PYTHON" - <<'PY'
          import json
          try:
              print(json.load(open("ci-results/run-info/summary-evidence.json", encoding="utf-8")).get("kind", "ci-failure"))
          except Exception:
              print("ci-failure")
          PY
          )"

          "$CI_PYTHON" scripts/ci/telegram_notify.py \
            --results ci-results \
            --no-env-repair \
            ai-triage \
            --kind "$KIND" \
            --context ci-results/run-info/summary-evidence.json \
            > ci-results/run-info/ai-triage.stdout 2>&1
          RC=$?

          "$CI_PYTHON" - "$RC" <<'PY'
          import json
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          root = Path("ci-results/run-info")
          raw = (root / "ai-triage.stdout").read_text(encoding="utf-8", errors="replace")

          (root / "ai-triage-exit.json").write_text(
              json.dumps({"exit_code": rc, "status": "OK" if rc == 0 else "FAILED"}, indent=2) + "\n",
              encoding="utf-8",
          )

          decoder = json.JSONDecoder()
          objects = []
          pos = 0
          while pos < len(raw):
              start = raw.find("{", pos)
              if start < 0:
                  break
              try:
                  obj, end = decoder.raw_decode(raw[start:])
              except json.JSONDecodeError:
                  pos = start + 1
                  continue
              if isinstance(obj, dict):
                  objects.append(obj)
              pos = start + end

          payload = objects[-1] if objects else {}
          telegram = payload.get("telegram") or {}
          result = payload.get("result") or {}
          ledger = {
              "exit_code": rc,
              "process_status": "OK" if rc == 0 else "FAILED",
              "ai_provenance": result.get("provenance"),
              "ai_delivered": bool(result.get("delivered")),
              "telegram": telegram,
          }
          (root / "telegram-delivery.json").write_text(
              json.dumps(ledger, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(ledger, indent=2, sort_keys=True))
          PY

          cat ci-results/run-info/ai-triage.stdout
          exit 0

      - name: Write canonical final summary
        if: \${{ always() }}
        env:
          CI_PYTHON: \${{ steps.env.outputs.python }}
          TARGET_WORKFLOW: \${{ steps.target.outputs.workflow }}
          TARGET_CONCLUSION: \${{ steps.target.outputs.conclusion }}
          TARGET_SHA: \${{ steps.target.outputs.sha }}
          TARGET_BRANCH: \${{ steps.target.outputs.branch }}
          TARGET_PR: \${{ steps.target.outputs.pr }}
          PR_SOURCE: \${{ steps.target.outputs.pr_source }}
          PR_REASON: \${{ steps.target.outputs.pr_reason }}
        shell: bash
        run: |
          set -euo pipefail
          "$CI_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("ci-results/run-info")

          try:
              art = json.loads((root / "ai-analysis.json").read_text(encoding="utf-8"))
          except Exception:
              art = {}

          try:
              tg = json.loads((root / "telegram-delivery.json").read_text(encoding="utf-8"))
          except Exception:
              tg = {}

          ai_text = (art.get("text") or "").strip()
          provenance = art.get("provenance") or "UNAVAILABLE"
          model = art.get("model") or "n/a"
          telegram_ok = bool((tg.get("telegram") or {}).get("ok"))

          lines = [
              "# NSE Final CI Summary",
              "",
              f"Workflow: {os.environ.get('TARGET_WORKFLOW','?')}",
              f"Target conclusion: {os.environ.get('TARGET_CONCLUSION','?')}",
              f"SHA: {os.environ.get('TARGET_SHA','?')[:12]}",
              f"Branch: {os.environ.get('TARGET_BRANCH','?')}",
              f"Associated PR: {os.environ.get('TARGET_PR') or 'none'}",
              f"PR resolution: {os.environ.get('PR_SOURCE','?')} / {os.environ.get('PR_REASON','?')}",
              f"AI provenance: {provenance}",
              f"AI model: {model}",
              f"Telegram delivery: {'SENT' if telegram_ok else 'FAILED/SKIPPED'}",
              "",
              "## Analysis",
              "",
          ]

          if ai_text:
              lines.extend(["AI ANALYSIS BEGIN", ai_text[:6000], "AI ANALYSIS END"])
          else:
              lines.append("No AI text was produced. See evidence and delivery ledger for the exact reason.")

          (root / "final-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print((root / "final-summary.md").read_text(encoding="utf-8"))
          PY

      - name: Publish GitHub Step Summary
        if: \${{ always() }}
        env:
          CI_PYTHON: \${{ steps.env.outputs.python }}
        shell: bash
        run: |
          set +e
          if [[ -s ci-results/run-info/final-summary.md ]]; then
            cat ci-results/run-info/final-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# NSE Final CI Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "Canonical summary generation failed; inspect job logs and artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
          "$CI_PYTHON" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          root = Path("ci-results/run-info")
          print("")
          print("## Delivery ledger")
          for name in ("evidence-collector.json", "ai-triage-exit.json", "telegram-delivery.json"):
              p = root / name
              if p.exists():
                  try:
                      data = json.loads(p.read_text(encoding="utf-8"))
                  except Exception:
                      data = {"status": "UNREADABLE"}
                  print(f"- {name}: {json.dumps(data, sort_keys=True)[:1400]}")
          PY
          exit 0

      - name: PR review comment (verified delivery)
        id: pr-comment
        if: \${{ always() && steps.target.outputs.pr != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: \${{ github.token }}
          PR_NUMBER: \${{ steps.target.outputs.pr }}
        shell: bash
        run: |
          set +e
          BODY_FILE="ci-results/run-info/final-summary.md"
          if [[ ! -s "$BODY_FILE" ]]; then
            echo '{"ok":false,"category":"PR_SUMMARY_MISSING","status":"FAILED"}' \
              > ci-results/run-info/pr-delivery.json
            echo "::warning::PR comment skipped because canonical summary is missing."
            exit 0
          fi

          {
            echo "**NSE final CI summary (advisory — evidence, not merge authorization)**"
            echo
            cat "$BODY_FILE"
          } > ci-results/run-info/pr-comment.md

          gh pr comment "$PR_NUMBER" \
            --body-file ci-results/run-info/pr-comment.md \
            --repo "$GITHUB_REPOSITORY"
          RC=$?

          if [[ $RC -eq 0 ]]; then
            printf '{"ok":true,"status":"SENT","pr":%s}\n' "$PR_NUMBER" \
              > ci-results/run-info/pr-delivery.json
            echo "PR delivery: SENT (PR #$PR_NUMBER)"
          else
            printf '{"ok":false,"status":"FAILED","pr":%s,"exit_code":%s}\n' "$PR_NUMBER" "$RC" \
              > ci-results/run-info/pr-delivery.json
            echo "::warning::PR comment delivery failed with exit code $RC."
          fi
          exit 0

      - name: Finalize delivery ledger
        if: \${{ always() }}
        env:
          CI_PYTHON: \${{ steps.env.outputs.python }}
          TARGET_PR: \${{ steps.target.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          "$CI_PYTHON" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path("ci-results/run-info")

          try:
              tg = json.loads((root / "telegram-delivery.json").read_text(encoding="utf-8"))
              tg_status = "SENT" if (tg.get("telegram") or {}).get("ok") else "FAILED"
          except Exception:
              tg_status = "NOT_RECORDED"

          try:
              pr = json.loads((root / "pr-delivery.json").read_text(encoding="utf-8"))
              pr_status = pr.get("status", "FAILED")
          except Exception:
              pr_status = "SKIPPED — no associated PR" if not os.environ.get("TARGET_PR") else "NOT_RECORDED"

          print("")
          print("## Final delivery")
          print(f"Telegram: **{tg_status}**")
          print(f"PR review/comment: **{pr_status}**")
          PY

      - name: Upload final summary artifacts
        if: \${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-final-summary-\${{ github.event.workflow_run.id }}-\${{ github.event.workflow_run.head_sha }}
          path: ci-results/run-info
          if-no-files-found: warn
          retention-days: 30

  event-feed:
    name: Push/PR event feed
    if: \${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Telegram push event summary + AI note
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          USER_ID: \${{ secrets.USER_ID }}
          AI_HOST: \${{ secrets.AI_HOST }}
          AI_KEY: \${{ secrets.AI_KEY }}
        run: |
          set +e
          mkdir -p ci-results/run-info
          python - <<'PY' || true
          import json, os, subprocess, sys
          ev = {}
          try:
              ev = json.load(open(os.environ.get("GITHUB_EVENT_PATH", ""), encoding="utf-8"))
          except Exception:
              pass
          commits = ev.get("commits") or []
          head = ev.get("head_commit") or {}
          author = ((head.get("author") or {}).get("name")) or ""
          msgs = "||".join((c.get("message") or "").splitlines()[0] for c in commits[:5])
          subprocess.run([
              sys.executable, "scripts/ci/telegram_notify.py", "--results", "ci-results",
              "push", "--author", author, "--commits", str(len(commits)),
              "--latest", (ev.get("after") or os.environ.get("GITHUB_SHA", ""))[:10],
              "--messages", msgs,
          ], timeout=120, check=False)
          json.dump({"kind": "push-summary", "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                     "branch": os.environ.get("GITHUB_REF_NAME", ""),
                     "commits": [{"sha": (c.get("id") or "")[:10],
                                  "message": ((c.get("message") or "").splitlines() or [""])[0][:160],
                                  "author": ((c.get("author") or {}).get("name")) or "",
                                  "added": len(c.get("added") or []), "removed": len(c.get("removed") or [])}
                                 for c in commits[:20]]},
                    open("ci-results/run-info/summary-evidence.json", "w", encoding="utf-8"),
                    indent=2, sort_keys=True)
          PY
          PYTHONPATH=src python scripts/ci/telegram_notify.py --results ci-results \
            ai-triage --kind push-summary \
            --context ci-results/run-info/summary-evidence.json || true
